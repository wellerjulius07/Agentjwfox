  // ---------------------------------------------------------------- Erinnerungstafel
  const tafelEl = $("#tafel"), tafelKarte = $("#tafelKarte");
  let tafelSitzung = false, tafelBekannt = null, tafelAktiv = null;

  function tafelSchluessel(x) { return x.art + ":" + x.id; }
  function tafelKandidaten() {
    const gesehen = gesehenHeute(), jetztMin = minuten(berlin().time);
    const A = aufgaben(), T = termine(), pool = [];
    for (const id of planIds()) { const t = A.find((x) => x.id === id); if (t) pool.push({ ...t, grund: "aus Deinem Tagesplan" }); }
    for (const t of A.filter((x) => x.tage != null && x.tage < 0).sort((a, b) => a.tage - b.tage)) pool.push({ ...t, grund: rel(t.tage) });
    for (const t of A.filter((x) => x.tage === 0)) pool.push({ ...t, grund: "heute fällig" });
    for (const e of T.filter((x) => x.tage === 0 && x.uhrzeit && minuten(x.uhrzeit) >= jetztMin))
      pool.push({ ...e, grund: `heute ${e.uhrzeit}` });
    for (const w of warnungen()) pool.push({ art: "warnung", id: w.id, titel: w.titel, detail: w.detail, rat: w.rat, grund: "vom Rechner" });
    const raus = [], gab = new Set();
    for (const p of pool) {
      const k = tafelSchluessel(p);
      if (gab.has(k) || gesehen.includes(k)) continue;
      gab.add(k); raus.push(p);
      if (raus.length >= TAFEL_MAX) break;
    }
    return raus;
  }
  const brauchtPlanung = () => S.db && !!S.projekt && planIds().length === 0
    && minuten(berlin().time) < 14 * 60 && aufgaben().length > 0;

  function tafelZeichnen() {
    if (tafelAktiv?.modus === "planung") {
      const A = aufgaben().sort((a, b) => (a.tage ?? 999) - (b.tage ?? 999)).slice(0, 8);
      tafelKarte.innerHTML = `<div class="tafel-kopf">
          <h2 id="tafelTitel">Guten Morgen. Wähle drei Dinge für heute.</h2>
          <p>Nur die kommen später auf diese Tafel. Alles andere bleibt still in der Liste.</p></div>
        <div class="waehler">${A.map((t) => `<button type="button" data-do="planwaehle" data-tafel="1" data-id="${esc(t.id)}">
          <span>${esc(kurz(t.titel, 60))}</span><small>${esc(t.tage == null ? "ohne Datum" : rel(t.tage))}</small></button>`).join("")}</div>
        <div class="tafel-fuss">${btn(`data-do="ruhe" data-min="240"`, "Ruhe bis mittags", "mini still")}
          <span class="weg">${btn(`data-do="tafelZu"`, "Später", "mini")}</span></div>`;
      return;
    }
    const karten = tafelAktiv?.karten || [];
    if (!karten.length) return tafelSchliessen();
    const wort = karten.length === 1 ? "Eine Sache" : karten.length === 2 ? "Zwei Dinge" : "Drei Dinge";
    tafelKarte.innerHTML = `<div class="tafel-kopf">
        <h2 id="tafelTitel">${wort} für heute.</h2>
        <p>Erledigt, später oder einfach zur Kenntnis — jede Karte hat einen Ausgang.</p></div>
      <div class="karten">${karten.map((k) => `<div class="karte${k.art === "warnung" || (k.tage != null && k.tage < 0) ? " alarm" : ""}">
        <h3>${esc(kurz(k.titel, 80))}</h3>
        <div class="wann">${esc([k.grund, k.art === "aufgabe" ? k.sektion?.name : k.art === "warnung" ? k.detail : k.teil].filter(Boolean).join(" · "))}</div>
        <div class="aus">
          ${k.art === "aufgabe" && S.mcp ? btn(`data-do="erledigt" data-tafel="1" data-art="aufgabe" data-id="${esc(k.id)}"`, "Erledigt", "mini primary") : ""}
          ${k.art !== "warnung" && S.mcp && spaeterZiele(k).length ? btn(`data-do="spaeterTafel" data-art="${k.art}" data-id="${esc(k.id)}"`, "Später", "mini") : ""}
          ${btn(`data-do="passt" data-tafel="1" data-art="${k.art}" data-id="${esc(k.id)}"`, "Passt", "mini still")}
        </div>
        ${k.offen ? `<div class="spaeter"><span class="spaeter-kopf">Verschieben auf</span>
          ${spaeterZiele(k).map((o) => btn(`data-do="spaeterZiel" data-tafel="1" data-art="${k.art}" data-id="${esc(k.id)}" data-datum="${o.datum}" data-uhrzeit="${o.uhrzeit || ""}"`,
            `${o.label} · ${zielWort(o)}`, "mini")).join("")}</div>` : ""}
      </div>`).join("")}</div>
      <div class="tafel-fuss">
        ${btn(`data-do="ruhe" data-min="240"`, "Ruhe 4 Std", "mini still")}
        ${btn(`data-do="ruhe" data-min="morgen"`, "Ruhe bis morgen", "mini still")}
        <span class="weg">${btn(`data-do="tafelZu"`, "Schließen", "mini")}</span></div>`;
  }

  let vorherFokus = null;
  function tafelOeffnen(modus, karten) {
    tafelAktiv = { modus, karten: karten || [] };
    vorherFokus = document.activeElement;
    tafelZeichnen();
    tafelEl.hidden = false;
    tafelSitzung = true;
    const erste = tafelKarte.querySelector("button");
    if (erste) erste.focus();
    tafelMerken({ letzteTafel: new Date().toISOString() });
  }
  function tafelSchliessen() {
    tafelEl.hidden = true; tafelAktiv = null;
    if (vorherFokus && document.contains(vorherFokus)) vorherFokus.focus();
  }
  tafelEl.addEventListener("click", (ev) => { if (ev.target === tafelEl) tafelSchliessen(); });

  function tafelPruefen(anlass) {
    if (!tafelEl.hidden || istStumm() || !S.caps) return;
    const h = heute();
    if (anlass === "start") {
      if (tafelSitzung) return;
      const l = S.tafelStand?.letzteTafel;
      if (l && Date.now() - Date.parse(l) < TAFEL_PAUSE_MIN * 60000) return;
    }
    if (anlass.startsWith("zeit:")) {
      const slot = anlass.slice(5);
      if ((S.tafelStand?.slots || {})[slot] === h) return;
      tafelMerken({ slots: { ...(S.tafelStand?.slots || {}), [slot]: h } });
    }
    if (brauchtPlanung() && (anlass === "start" || anlass === "zeit:08:30")) return tafelOeffnen("planung");
    const k = tafelKandidaten();
    if (k.length) tafelOeffnen("karten", k);
  }

  // Schwellen: ein Eintrag wird heute fällig oder überfällig, während die Seite offen ist.
  function schwellenPruefen() {
    const jetzt = new Set(tafelKandidaten().map(tafelSchluessel));
    if (tafelBekannt === null) { tafelBekannt = jetzt; return; }
    const neu = [...jetzt].filter((k) => !tafelBekannt.has(k));
    tafelBekannt = jetzt;
    if (neu.length && tafelEl.hidden) tafelPruefen("schwelle");
  }

  setInterval(() => {
    const jetztMin = minuten(berlin().time), h = heute();
    const faellig = TAFEL_ZEITEN.find((z) => jetztMin >= minuten(z) && (S.tafelStand?.slots || {})[z] !== h);
    if (faellig) tafelPruefen("zeit:" + faellig);
    else schwellenPruefen();
    if (blick === "puls") renderPuls();
    if (blick === "kalender") renderKalender();
    renderStatus();
  }, 60000);

  async function ruheSetzen(min) {
    const bis = min === "morgen"
      ? new Date(Date.parse(`${isoTag(tagNr(heute()) + 1)}T06:00:00${offsetFuer(isoTag(tagNr(heute()) + 1))}`)).toISOString()
      : new Date(Date.now() + (+min) * 60000).toISOString();
    await tafelMerken({ stumm_bis: bis });
    tafelSchliessen();
    toast(`Ruhe bis ${stempel(bis)}. Die Tafel meldet sich vorher nicht.`);
    renderStatus();
  }

  // ---------------------------------------------------------------- Schnelleintrag ohne KI
  const WOCHENTAG = { so: 0, son: 0, sonntag: 0, mo: 1, mon: 1, montag: 1, di: 2, die: 2, dienstag: 2,
    mi: 3, mit: 3, mittwoch: 3, do: 4, don: 4, donnerstag: 4, fr: 5, fre: 5, freitag: 5,
    sa: 6, sam: 6, samstag: 6, sonnabend: 6 };
  const RELATIV = { heute: 0, morgen: 1, "übermorgen": 2, uebermorgen: 2 };

  function parseKurz(text) {
    let t = " " + text.trim().replace(/\s+/g, " ") + " ";
    let prio = null, fach = null, dauer = null, datum = null, uhrzeit = null, hatDatumWort = false;

    if (/\s!!\s/.test(t)) { prio = "p1"; t = t.replace(/\s!!\s/, " "); }
    else if (/\s!\s/.test(t)) { prio = "p2"; t = t.replace(/\s!\s/, " "); }

    t = t.replace(/\s#([\p{L}\d][\p{L}\d-]*)/u, (m, name) => {
      const norm = (s) => s.toLowerCase().replace(/[^\p{L}\d]/gu, "");
      const s = sektionen().find((x) => norm(x.name).startsWith(norm(name)));
      if (s) { fach = s; return " "; }
      return m;
    });

    t = t.replace(/\s(\d{1,3})(?:[.,](\d))?\s?(minuten|min|std|stunden|stunde|h|m)(?=\s)/iu, (m, a, b, e) => {
      const v = parseFloat(a + (b ? "." + b : ""));
      dauer = /^(h|std|stunde)/i.test(e) ? Math.round(v * 60) : Math.round(v);
      return " ";
    });

    // Datum: nächste Woche, relative Wörter, Wochentag, TT.MM.
    t = t.replace(/\s(n(?:ä|ae)chste[nr]?\s+woche)(?=\s)/iu, () => { datum = naechsterWochentag(1); hatDatumWort = true; return " "; });
    if (!datum) t = t.replace(/\s(heute|morgen|(?:ü|ue)bermorgen)(?=\s)/iu, (m, w) => {
      datum = isoTag(tagNr(heute()) + RELATIV[w.toLowerCase().replace("ü", "ue")]); hatDatumWort = true; return " "; });
    if (!datum) t = t.replace(/\s(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?(?=\s)/u, (m, d, mo, j) => {
      const jahr = j ? (j.length === 2 ? 2000 + +j : +j) : null;
      const kand = `${jahr || +heute().slice(0, 4)}-${String(+mo).padStart(2, "0")}-${String(+d).padStart(2, "0")}`;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(kand) || +mo > 12 || +d > 31) return m;
      datum = !jahr && tageBis(kand) < -14 ? `${+heute().slice(0, 4) + 1}-${String(+mo).padStart(2, "0")}-${String(+d).padStart(2, "0")}` : kand;
      hatDatumWort = true; return " "; });
    if (!datum) t = t.replace(/\s(?:am\s)?(\p{L}{2,11})(?=\s)/gu, (m, w) => {
      if (datum) return m;
      const n = WOCHENTAG[w.toLowerCase().replace(/\.$/, "")];
      if (n == null) return m;
      datum = naechsterWochentag(n); hatDatumWort = true; return " "; });

    // Uhrzeit: 14:30 · um 14 · 14 Uhr · bei erkanntem Datum auch eine blanke Zahl
    t = t.replace(/\s(?:um\s)?(\d{1,2}):(\d{2})(?:\s?uhr)?(?=\s)/iu, (m, h, mi) => {
      if (+h > 23 || +mi > 59) return m;
      uhrzeit = `${String(+h).padStart(2, "0")}:${mi}`; return " "; });
    if (!uhrzeit) t = t.replace(/\s(?:um\s)?(\d{1,2})\s?uhr(?=\s)/iu, (m, h) => {
      if (+h > 23) return m;
      uhrzeit = `${String(+h).padStart(2, "0")}:00`; return " "; });
    if (!uhrzeit) t = t.replace(/\sum\s(\d{1,2})(?=\s)/iu, (m, h) => {
      if (+h > 23) return m;
      uhrzeit = `${String(+h).padStart(2, "0")}:00`; return " "; });
    if (!uhrzeit && hatDatumWort) t = t.replace(/\s(\d{1,2})(?=\s)/u, (m, h) => {
      if (+h > 23) return m;
      uhrzeit = `${String(+h).padStart(2, "0")}:00`; return " "; });

    const titel = t.replace(/\s+(bis|am|um|ab)\s*$/iu, " ").trim().replace(/\s+/g, " ");
    if (!titel || (!datum && !uhrzeit)) return null;
    const aufgabeWort = /\b(abgabe|abgeben|bis|erledigen|anrufen|schreiben|lernen|(ü|ue)bungsblatt)\b/iu.test(text);
    const art = uhrzeit && !aufgabeWort ? "termin" : "aufgabe";
    return { art, titel, datum: datum || heute(), uhrzeit, dauerMin: dauer || 60, fach: fach?.name || null,
      labels: [], prio, hinweis: null };
  }

  const istFrage = (s) => /\?\s*$/.test(s) ||
    /^(was|wann|wie|warum|wieso|welche|welcher|wer|wo|gibt|habe|hab|kann|soll|zeig|erklär|erklaer)\b/iu.test(s.trim());
  const mehrteilig = (s) => /,|\bund\b/iu.test(s) && s.trim().split(/\s+/).length > 4;

  // ---------------------------------------------------------------- Eingabefeld
  const form = $("#ask"), feld = $("#askInput"), antwort = $("#antwort");

            <option value="termin"${e.art === "termin" ? " selected" : ""}>Termin · Kalender</option></select></div>

        </div>

          <option value="">ohne Fach · Inbox</option>
          ${sek.map((s) => `<option value="${esc(s.name)}"${e.fach === s.name ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
      </div>
      ${e.hinweis ? `<p class="leer">${esc(e.hinweis)}</p>` : ""}
      <div class="z-a" style="margin:0">
        ${S.mcp ? btn(`data-do="entwurfAnlegen"`, "Anlegen", "primary") : `<span class="leer">Anlegen geht nur in der Claude-Ansicht.</span>`}
        ${btn(`data-do="antwortZu"`, "Verwerfen", "still")}</div>${zuKnopf}`);

  function entwurfLesen() {
    const g = (id) => $("#" + id)?.value || "";
    const art = g("eArt") === "termin" ? "termin" : "aufgabe";
    return { art, titel: g("eTitel").trim().slice(0, 200), datum: /^\d{4}-\d{2}-\d{2}$/.test(g("eDatum")) ? g("eDatum") : null,
      uhrzeit: /^\d{2}:\d{2}$/.test(g("eZeit")) ? g("eZeit") : null,
      dauerMin: clamp(Math.round(+g("eDauer") || 60), 5, 720), fach: g("eFach") || null,
      labels: entwurf?.labels || [], prio: entwurf?.prio || null, hinweis: entwurf?.hinweis || null };
  }

  function todoistEingabe(p) {
    const s = p.fach && sektionen().find((x) => x.name === p.fach);
    const o = { content: p.titel, labels: [...new Set([...(p.labels || []), "auto"])] };
    if (s) o.sectionId = s.id; else o.projectId = S.projektMeta?.id || "inbox";
    if (p.datum) o.dueString = p.datum + (p.uhrzeit ? " " + p.uhrzeit : "");
    if (p.prio) o.priority = p.prio;
    if (p.hinweis) o.description = p.hinweis;
    return o;
  }
  function kalenderEingabe(p) {
    const datum = p.datum || heute();
    if (!p.uhrzeit) return { summary: p.titel, allDay: true, startTime: `${datum}T00:00:00${offsetFuer(datum)}`,
      endTime: `${isoTag(tagNr(datum) + 1)}T00:00:00${offsetFuer(datum)}`, timeZone: TZ };
    const endMin = minuten(p.uhrzeit) + p.dauerMin;
    const endDatum = endMin >= 24 * 60 ? isoTag(tagNr(datum) + 1) : datum;
    const o = { summary: p.titel, startTime: `${datum}T${p.uhrzeit}:00${offsetFuer(datum)}`,
      endTime: `${endDatum}T${alsUhr(endMin)}:00${offsetFuer(endDatum)}`, timeZone: TZ };
    if (p.hinweis) o.description = p.hinweis;
    return o;
  }

  async function anlegenKern(liste) {
    const fertig = [], schief = [];
    const aufg = liste.filter((p) => p.art === "aufgabe");
    if (aufg.length) {
      try {
        const res = await tdo("add-tasks", { tasks: aufg.map(todoistEingabe) });
        const angelegt = (res?.tasks || []).map((t) => t.content);
        for (const p of aufg) {
          const i = angelegt.indexOf(p.titel);
          if (i >= 0) { angelegt.splice(i, 1); fertig.push(p); }
          else schief.push({ p, warum: "Todoist hat den Eintrag abgelehnt." });
        }
      } catch (e) { for (const p of aufg) schief.push({ p, warum: mcpText(e, "Todoist", true) }); }
    }
    for (const p of liste.filter((x) => x.art === "termin")) {
      try { await gcal("create_event", kalenderEingabe(p)); fertig.push(p); }
      catch (e) { schief.push({ p, warum: mcpText(e, "Google Kalender", true) }); }
    }
    const nT = fertig.filter((p) => p.art === "aufgabe").length, nE = fertig.length - nT;
    if (nT) { frischT(); funke("todoist"); }
    if (nE) { frischK(); funke("kalender"); }
    if (S.db && fertig.length) {
      const am = new Date().toISOString();
      S.db.doc("journal/intake").set({ eintraege: [
        ...fertig.map((p) => ({ art: p.art, titel: p.titel, datum: p.datum, uhrzeit: p.uhrzeit, fach: p.fach, am })),
        ...S.journal].slice(0, 30) }).catch(() => {});
    }
    return { fertig, schief, nT, nE };
  }

  // Der Weg über das Eingabefeld oben: dasselbe Anlegen, nur mit Quittung darunter.
  async function anlegen(liste) {
    const { fertig, schief, nT, nE } = await anlegenKern(liste);
    const wann = (p) => `${p.datum ? (tageBis(p.datum) === 0 ? "heute" : tageBis(p.datum) === 1 ? "morgen" : kurzDatum(p.datum)) : "ohne Datum"}${p.uhrzeit ? " " + p.uhrzeit : ""}`;
    zeigeAntwort(`<p>${fertig.length
      ? `Angelegt: ${[nE ? `${nE} ${nE === 1 ? "Termin" : "Termine"}` : "", nT ? `${nT} ${nT === 1 ? "Aufgabe" : "Aufgaben"}` : ""].filter(Boolean).join(" und ")}.`
      : "Nichts angelegt."}</p>
      <ul class="ergebnis">${fertig.map((p) => `<li><span class="ja">✓</span><span>${esc(p.titel)} · ${esc(wann(p))}</span></li>`).join("")}
      ${schief.map((f) => `<li><span class="nein">!</span><span>${esc(f.p.titel)}: ${esc(f.warum)}</span></li>`).join("")}</ul>${zuKnopf}`);
    entwurf = null;
  }

  // ---------------------------------------------------------------- Claude fragen (mit Budget)
  function promptBauen(q) {
    const n = berlin();
    const wd = new Intl.DateTimeFormat("de-DE", { weekday: "long", timeZone: TZ }).format(new Date());
    const L = [];
    L.push("Du bist das Semester-Cortex: das Assistenz-Gehirn eines Studenten (FOM). Du kennst sein Studium, seine Termine und die Datei-Automation auf seinem Rechner. Sprich ihn mit du an.");
    L.push(`Jetzt: ${wd}, ${n.date}, ${n.time} Uhr (Europe/Berlin).`, "", "EINGABE:", q.slice(0, 1200), "");
    L.push('Entscheide den typ: "frage" = er will eine Auskunft. "eintrag" = er zählt Dinge auf, die angelegt werden sollen. "aktion" = er will bestehende Einträge erledigen, verschieben oder als wiederholt markieren.', "");
    L.push("FÄCHER (exakte Namen):", ...sektionen().map((s) => "- " + s.name), "");
    const A = aufgaben().sort((a, b) => (a.tage ?? 999) - (b.tage ?? 999)).slice(0, 30);
    L.push("OFFENE AUFGABEN (id | titel | fällig | fach):",
      ...A.map((t) => `- ${t.id} | ${kurz(t.titel, 70)} | ${t.datum ? t.datum + (t.uhrzeit ? " " + t.uhrzeit : "") : "ohne Datum"} | ${t.sektion?.name || "-"}`), "");
    const T = termine().slice(0, 15);
    L.push("TERMINE (id | datum | zeit | titel):",
      ...T.map((e) => `- ${e.id} | ${e.datum} | ${e.uhrzeit || "ganztägig"} | ${kurz(e.titel, 50)}`), "");
    const TH = themenAktiv().slice(0, 20);
    if (TH.length) L.push("LERNTHEMEN (id | thema | fällig am):", ...TH.map((t) => `- ${t.id} | ${t.name} | ${t.faellig}`), "");
    if (S.zustand) {
      L.push("RECHNER:", `- Stand ${S.zustand.stand}`,
        `- Downloads: ${S.zustand.downloads?.dateien ?? "?"} Dateien`,
        ...warnungen().slice(0, 4).map((w) => `- Warnung: ${w.titel} (${w.detail || ""})`), "");
    }
    L.push("ANTWORTE MIT GENAU EINEM JSON-OBJEKT, ohne weiteren Text.",
      '"frage": {"typ":"frage","antwort":"höchstens 3 kurze Sätze auf Deutsch","refs":[{"art":"aufgabe|termin|thema|organ","id":"..."}]}',
      '"eintrag": {"typ":"eintrag","antwort":"ein kurzer Satz","vorschlaege":[{"art":"termin|aufgabe","titel":"kurz","fach":null,"datum":"YYYY-MM-DD","uhrzeit":"HH:MM","dauerMin":60,"labels":[],"unsicher":false,"hinweis":null}]}',
      '"aktion": {"typ":"aktion","antwort":"ein kurzer Satz","op":"erledigt|verschieben|wiederholt","ziele":[{"art":"aufgabe|termin|thema","id":"..."}],"datum":"YYYY-MM-DD","uhrzeit":null}',
      "REGELN:",
      '- "termin" ist etwas mit fester Zeit, zu dem man irgendwo sein muss. "aufgabe" ist etwas zu erledigen, auch mit Frist. Anrufe und Nachrichten sind Aufgaben.',
      '- Relative Angaben ("Freitag", "morgen", "nächste Woche") in ein konkretes Datum ab heute umrechnen.',
      '- Unklare Zeiten ("nachmittags"): wähle eine freie Lücke laut TERMINE, setze "unsicher": true und begründe im "hinweis" in einem Satz.',
      '- "fach" nur bei eindeutiger Zuordnung, mit exaktem Namen aus FÄCHER. Sonst null.',
      `- "labels" nur aus: ${LABELS_ERLAUBT.join(", ")}. Leere Liste erlaubt.`,
      '- Bei "aktion" und "refs" nur ids aus den Listen oben verwenden. Nichts erfinden.',
      '- Gibt die Datenlage etwas nicht her, sag das in "antwort" statt zu raten.');
    return L.join("\n").slice(0, 9000);
  }

  function normVorschlag(p) {
    if (!p || typeof p !== "object") return null;
    const titel = String(p.titel || "").trim().slice(0, 200);
    if (!titel) return null;
    const namen = sektionen().map((s) => s.name);
    return { art: p.art === "termin" ? "termin" : "aufgabe", titel,
      fach: namen.includes(p.fach) ? p.fach : null,

      uhrzeit: /^\d{2}:\d{2}$/.test(p.uhrzeit || "") ? p.uhrzeit : null,
      dauerMin: clamp(Math.round(Number(p.dauerMin) || 60), 5, 720),
      labels: (Array.isArray(p.labels) ? p.labels : []).filter((l) => LABELS_ERLAUBT.includes(l)),
      prio: null, unsicher: !!p.unsicher, hinweis: p.hinweis ? String(p.hinweis).slice(0, 240) : null };
  }

  let vorschlagListe = [];
  const anzahlWort = (n) => n === 0 ? "Nichts ausgewählt" : n === 1 ? "1 Eintrag anlegen" : `${n} Einträge anlegen`;
  function zeigeVorschlaege(lead) {
    const meta = (p) => [p.unsicher ? "Vorschlag: " + (p.datum ? kurzDatum(p.datum) : "ohne Datum") : (p.datum ? kurzDatum(p.datum) : "ohne Datum"),
      p.uhrzeit || "", p.art === "termin" && p.uhrzeit ? p.dauerMin + " Min" : "",
      p.art === "aufgabe" ? (p.fach || "Inbox") : "Kalender", (p.labels || []).join(" ")].filter(Boolean).join(" · ");
    zeigeAntwort(`<p class="lead">${esc(lead || "Das habe ich verstanden:")}</p>
      <ul class="vorschlaege">${vorschlagListe.map((p, i) => `<li><label><input type="checkbox" data-i="${i}" checked>
        <span class="v-art ${p.art}">${p.art === "termin" ? "Termin" : "Aufgabe"}</span>
        <span>${esc(p.titel)}</span><span class="v-m">${esc(meta(p))}</span></label>
        ${p.hinweis ? `<em class="v-h">${esc(p.hinweis)}</em>` : ""}</li>`).join("")}</ul>
      <div class="z-a" style="margin:0">
        ${S.mcp ? btn(`data-do="vorschlaegeAnlegen"`, anzahlWort(vorschlagListe.length), "primary")
          : `<span class="leer">Anlegen geht nur in der Claude-Ansicht.</span>`}
        ${btn(`data-do="antwortZu"`, "Verwerfen", "still")}</div>${zuKnopf}`);
    funke("du");
  }
  antwort.addEventListener("change", () => {
    const b = antwort.querySelector('[data-do="vorschlaegeAnlegen"]');
    if (!b) return;
    const n = antwort.querySelectorAll("input[data-i]:checked").length;
    b.textContent = anzahlWort(n); b.disabled = n === 0;
  });

  function zeigeAktion(r) {
    const ziele = (Array.isArray(r.ziele) ? r.ziele : []).map((z) => findeSache(z.art, z.id)).filter(Boolean);
    if (!ziele.length) return zeigeAntwort(`<p>${esc(r.antwort || "Dazu habe ich keinen passenden Eintrag gefunden.")}</p>${zuKnopf}`);
    const op = ["erledigt", "verschieben", "wiederholt"].includes(r.op) ? r.op : null;
    if (!op) return zeigeAntwort(`<p>${esc(r.antwort || "Das habe ich nicht eindeutig verstanden.")}</p>${zuKnopf}`);
    const datum = /^\d{4}-\d{2}-\d{2}$/.test(r.datum || "") ? r.datum : null;
    const uhrzeit = /^\d{2}:\d{2}$/.test(r.uhrzeit || "") ? r.uhrzeit : null;
    if (op === "verschieben" && !datum) return zeigeAntwort(`<p>Auf welches Datum soll ich verschieben?</p>${zuKnopf}`);
    aktionEntwurf = { op, ziele, datum, uhrzeit };
    const wort = op === "erledigt" ? "abhaken" : op === "verschieben" ? `auf ${kurzDatum(datum)}${uhrzeit ? ", " + uhrzeit : ""} verschieben` : "als wiederholt markieren";
    zeigeAntwort(`<p class="lead">${esc(r.antwort || "")}</p>
      <p>Soll ich ${ziele.length === 1 ? "das" : `diese ${ziele.length}`} ${wort}?</p>
      <ul class="ergebnis">${ziele.map((z) => `<li><span>·</span><span>${esc(kurz(z.titel || z.name, 70))}</span></li>`).join("")}</ul>
      <div class="z-a" style="margin:0">${btn(`data-do="aktionAusfuehren"`, "Ja, machen", "primary")}
        ${btn(`data-do="antwortZu"`, "Nein", "still")}</div>${zuKnopf}`);
  }

  async function aktionAusfuehren() {
    const a = aktionEntwurf;
    if (!a) return;
    aktionEntwurf = null;
    let n = 0;
    for (const z of a.ziele) {
      if (a.op === "erledigt" && z.art === "aufgabe") n += (await erledigen(z)) ? 1 : 0;
      else if (a.op === "verschieben") n += (await verschieben(z, { datum: a.datum, uhrzeit: a.uhrzeit })) ? 1 : 0;
      else if (a.op === "wiederholt" && z.name) n += (await wiederholen(z, "wiederholt")) ? 1 : 0;
    }
    zeigeAntwort(`<p>${n ? `${n} von ${a.ziele.length} erledigt.` : "Nichts geändert."} Einzelne Schritte kannst Du unten im Hinweis zurücknehmen.</p>${zuKnopf}`);
  }

  function verarbeiteAntwort(r) {
    if (!r || typeof r !== "object") return zeigeAntwort(`<p>${esc(sampleText({ code: "invalid_json" }))}</p>${zuKnopf}`);
    if (r.typ === "aktion") return zeigeAktion(r);
    if (r.typ === "eintrag" && Array.isArray(r.vorschlaege)) {
      vorschlagListe = r.vorschlaege.slice(0, 12).map(normVorschlag).filter(Boolean);
      if (vorschlagListe.length === 1) return zeigeEntwurf({ ...vorschlagListe[0] });
      if (vorschlagListe.length) return zeigeVorschlaege(r.antwort);
    }
    const refs = (Array.isArray(r.refs) ? r.refs : []).map((z) => ({ z, s: findeSache(z.art, z.id) || (z.art === "organ" ? organById[z.id] : null) }))
      .filter((x) => x.s).slice(0, 6);
    zeigeAntwort(`<p>${esc(r.antwort || "Dazu habe ich nichts gefunden.")}</p>
      ${refs.length ? `<div class="refs">${refs.map(({ z, s }) => {
        const farbe = z.art === "organ" ? s.farbe : "var(--synapse)";
        return `<button type="button" class="ref" data-do="${z.art === "organ" ? "organ" : "blatt"}" data-art="${esc(z.art)}" data-id="${esc(z.id)}" style="--c:${farbe}"><i></i>${esc(kurz(s.titel || s.name, 34))}</button>`;
      }).join("")}</div>` : ""}${zuKnopf}`);
    funke("du");
  }

  async function claudeFragen(q) {
    if (!S.sample) return zeigeAntwort(`<p>Claude ist für diese Seite nicht freigegeben. Kurzschrift wie „Zahnarzt Fr 14“ funktioniert weiter.</p>${zuKnopf}`);
    fragenCtl?.abort();
    const ctl = (fragenCtl = new AbortController());
    denkt = true;
    zeigeAntwort(`<div class="denkt"><span class="spark"></span>Denkt nach …</div>
      <div class="z-a" style="margin:0">${btn(`data-do="stopp"`, "Stopp", "mini still")}</div>`);
    funke("du");
    try {
      const r = await S.sample.json(promptBauen(q), { signal: ctl.signal, cache: false });
      if (ctl !== fragenCtl) return;
      feld.value = "";
      verarbeiteAntwort(r);
    } catch (e) {
      if (ctl !== fragenCtl || e?.code === "cancelled") return;
      zeigeAntwort(`<p>${esc(sampleText(e))}</p>${zuKnopf}`);
    } finally { if (ctl === fragenCtl) denkt = false; }
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const q = feld.value.trim();
    if (!q) return;
    if (istFrage(q)) return claudeFragen(q);
    const kurzParse = mehrteilig(q) ? null : parseKurz(q);
    if (kurzParse) { feld.value = ""; return zeigeEntwurf(kurzParse); }
    claudeFragen(q);
  });

  // ---------------------------------------------------------------- Handlungen
  async function vorschlagEntscheiden(id, status) {
    if (!S.db) return;
    try {
      await S.db.doc("vorschlaege/" + id).update({ status, entschieden: new Date().toISOString() });
      toast(status === "angenommen" ? "Vorgemerkt. Umgesetzt wird, sobald Du es im Chat anstößt." : "Verworfen.");
    } catch (e) { toast(dbText(e)); }
  }

  document.addEventListener("click", async (ev) => {
    const el = ev.target.closest("[data-do]");
    if (!el) return;
    const d = el.dataset, tafelHier = d.tafel === "1";

    const nachTafelAktion = (schluessel) => {
      if (!tafelHier || !tafelAktiv) return;
      tafelAktiv.karten = (tafelAktiv.karten || []).filter((k) => tafelSchluessel(k) !== schluessel);
      if (!tafelAktiv.karten.length && tafelAktiv.modus !== "planung") tafelSchliessen(); else tafelZeichnen();
    };

    switch (d.do) {
      case "blatt": blattSache(d.art, d.id); break;
      case "organ":
        blattOrgan(d.id);
        if (typeof auswahlSetzen === "function") auswahlSetzen(d.id);
        organeZeigen(false);        // die Liste hat ihren Zweck erfüllt, das Blatt braucht den Platz
        break;
      case "organeAuf": organeZeigen(true); break;
      case "organeZu": organeZeigen(false); break;
      case "kaltag": {
        kalGewaehlt = d.datum;
        renderKalender();
        const ziel = document.getElementById("kal-" + d.datum);
        if (ziel) ziel.scrollIntoView({ behavior: ruhig ? "auto" : "smooth", block: "start" });
        break;
      }
      case "zu": blattZu(); break;
      case "antwortZu": antwortZu(); break;
      case "stopp": fragenCtl?.abort(); antwortZu(); break;
      case "blick": blickSetzen(d.blick); break;
      case "tafelZu": tafelSchliessen(); break;
      case "ruhe": ruheSetzen(d.min); break;

      case "erledigt": {
        const t = findeSache("aufgabe", d.id);
        if (!t) break;
        el.disabled = true;
        if (await erledigen(t)) nachTafelAktion("aufgabe:" + d.id);
        else el.disabled = false;
        break;
      }
      case "spaeter": blattSpaeter(d.art, d.id); break;
      case "spaeterTafel": {
        if (!tafelAktiv) break;
        for (const k of tafelAktiv.karten) if (tafelSchluessel(k) === d.art + ":" + d.id) k.offen = !k.offen;
        tafelZeichnen();
        break;
      }
      case "spaeterZiel": {
        const x = findeSache(d.art, d.id);
        if (!x) break;
        el.disabled = true;
        const ok = await verschieben(x, { datum: d.datum, uhrzeit: d.uhrzeit || null });
        if (ok) { blattZu(); nachTafelAktion(d.art + ":" + d.id); } else el.disabled = false;
        break;
      }
      case "einplanen": blattEinplanen(d.id); break;
      case "einplanenDauer": blattEinplanen(d.id, +d.dauer); break;
      case "einplanenZiel": {
        const t = findeSache("aufgabe", d.id);
        if (!t) break;
        el.disabled = true;
        if (await einplanen(t, { datum: d.datum, uhrzeit: d.uhrzeit }, +d.dauer)) blattZu();
        else el.disabled = false;
        break;
      }
      case "wiederholt": case "morgen": case "sitzt": {
        const t = findeSache("thema", d.id);
        if (!t) break;
        el.disabled = true;
        if (!(await wiederholen(t, d.do))) el.disabled = false;
        break;
      }
      case "plan": {
        const ids = planIds();
        if (ids.includes(d.id)) await planSetzen(ids.filter((x) => x !== d.id));
        else if (ids.length >= PLAN_MAX) toast(`Drei ist das Maximum. Nimm erst einen heraus.`);
        else await planSetzen([...ids, d.id]);
        break;
      }
      case "planwahl": blattPlanwahl(); break;
      case "themaNeu": blattThemaNeu(); break;
      case "klausurNeu": blattKlausurNeu(); break;
      case "themaAnlegen": {
        const zeilen = ($("#thNamen")?.value || "").split("\n").map((z) => z.trim()).filter(Boolean);
        if (!zeilen.length) { toast("Ohne Namen geht es nicht."); break; }
        const modul = $("#thModul")?.value || null;
        el.disabled = true;
        if (await themaAnlegen(zeilen.map((name) => ({ name, modul })))) blattZu(); else el.disabled = false;
        break;
      }
      case "klausurAnlegen": {
        const fach = ($("#klFach")?.value || "").trim();
        const datum = $("#klDatum")?.value || "";
        if (!fach) { toast("Ohne Fach geht es nicht."); break; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(datum)) { toast("Bitte ein Datum wählen."); break; }
        const mods = [...blattBody.querySelectorAll("input[data-mod]:checked")].map((x) => x.dataset.mod);
        el.disabled = true;
        if (await klausurAnlegen([{ fach, datum, module: mods,
          uhrzeit: $("#klZeit")?.value || null, ort: $("#klOrt")?.value || null }])) blattZu();
        else el.disabled = false;
        break;
      }
      case "themaWeg": {
        const t = findeSache("thema", d.id);
        el.disabled = true;
        if (t && await themaLoeschen(t)) blattZu(); else el.disabled = false;
        break;
      }
      case "klausurWeg": {
        const k = findeSache("klausur", d.id);
        el.disabled = true;
        if (k && await klausurLoeschen(k)) blattZu(); else el.disabled = false;
        break;
      }
      case "planweg": await planSetzen(planIds().filter((x) => x !== d.id)); break;
      case "planwaehle": {
        const ids = planIds();
        if (ids.length >= PLAN_MAX) { toast("Drei ist das Maximum."); break; }
        await planSetzen([...ids, d.id]);
        if (tafelHier) { if (planIds().length >= PLAN_MAX) tafelSchliessen(); else tafelZeichnen(); }
        else blattPlanwahl();
        break;
      }
      case "passt": {
        await tafelMerken({ gesehenZusatz: [d.art + ":" + d.id] });
        nachTafelAktion(d.art + ":" + d.id);
        if (!tafelHier) { blattZu(); toast("Gesehen. Heute meldet sich das nicht mehr."); }
        break;
      }
      case "vorschlag": el.disabled = true; await vorschlagEntscheiden(d.id, d.status); break;
      case "entwurfAnlegen": {
        const p = entwurfLesen();
        if (!p.titel) { toast("Ohne Titel geht es nicht."); break; }
        el.disabled = true;
        await anlegen([p]);
        break;
      }
      case "vorschlaegeAnlegen": {
        const gewaehlt = vorschlagListe.filter((_, i) => antwort.querySelector(`input[data-i="${i}"]`)?.checked);
        if (!gewaehlt.length) break;
        el.disabled = true; el.textContent = "Wird angelegt …";
        await anlegen(gewaehlt);
        break;
      }
      case "aktionAusfuehren": el.disabled = true; await aktionAusfuehren(); break;
    }
  });

  addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!tafelEl.hidden) tafelSchliessen();
    else if (!antwort.hidden) antwortZu();
    else if (!blatt.hidden) blattZu();
    else if (organeOffen) organeZeigen(false);
  });
  // Fokus bleibt in der Tafel, solange sie offen ist.
  tafelEl.addEventListener("keydown", (e) => {
    if (e.key !== "Tab") return;
    const f = [...tafelKarte.querySelectorAll("button:not([disabled])")];
    if (!f.length) return;
    const erste = f[0], letzte = f[f.length - 1];
    if (e.shiftKey && document.activeElement === erste) { e.preventDefault(); letzte.focus(); }
    else if (!e.shiftKey && document.activeElement === letzte) { e.preventDefault(); erste.focus(); }
  });

  // ---------------------------------------------------------------- Gedächtnis füllen
  // Bis hierher konnte das Gedächtnis nur wiederholen, was schon drinstand —
  // es hatte keinen Eingang. Das hier ist der Eingang, und der Ausgang gleich mit.
  const neueId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  async function themaAnlegen(liste) {
    if (!S.db) { toast("Der Speicher ist in dieser Ansicht nicht verfügbar."); return 0; }
    let n = 0;
    for (const x of liste.slice(0, 15)) {
      const name = String(x?.name ?? "").trim().slice(0, 140);
      if (!name) continue;
      const modul = String(x?.modul ?? "").trim() || null;
      try {
        // Stufe 0 und heute fällig: ein neues Thema will einmal angesehen werden,
        // bevor die Abstände anfangen zu wachsen.
        await S.db.doc("themen/" + neueId("t")).set({
          name, modul, stufe: 0, faellig: heute(), zuletzt: null,
          wiederholungen: 0, angelegt: new Date().toISOString(),
        });
        n++;
      } catch (e) { toast(dbText(e)); break; }
    }
    if (n) { funke("gedaechtnis"); toast(n === 1 ? "Steht im Gedächtnis, ab heute fällig." : `${n} Themen stehen im Gedächtnis.`); }
    return n;
  }

  async function themaLoeschen(t) {
    if (!S.db) return false;
    const { tage, id, ...rein } = t;                      // abgeleitetes wieder abstreifen
    try {
      await S.db.doc("themen/" + t.id).delete();
      toast(`${kurz(t.name, 30)}: aus dem Gedächtnis genommen.`, async () => {
        try { await S.db.doc("themen/" + t.id).set(rein); }
        catch (e) { const s = dbText(e); throw Object.assign(new Error(s), { __text: s }); }
      });
      return true;
    } catch (e) { toast(dbText(e)); return false; }
  }

  // Module, aus denen gewählt werden kann: was schon im Gedächtnis steht, plus die Fächer.
  const moduleMitThemen = () => [...new Set(S.themen.map((t) => t.modul).filter(Boolean))].sort();
  const module = () => [...new Set([...moduleMitThemen(), ...sektionen().map((s) => s.name)])];

  function blattThemaNeu() {
    blattZeigen(`<h3>Ins Gedächtnis legen</h3>
      <p>Ein Thema pro Zeile. Jedes kommt nach ${INTERVALLE.join(", ")} Tagen wieder dran — und heute zum ersten Mal.</p>
      <div class="felder">
        <div class="feld"><label for="thNamen">Themen</label>
          <textarea id="thNamen" rows="4" placeholder="Ableitungsregeln&#10;Grenzwerte&#10;Stetigkeit"></textarea></div>
        <div class="feld"><label for="thModul">Modul</label>
          <select id="thModul"><option value="">ohne Modul</option>
            ${module().map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("")}</select></div>
      </div>
      <div class="z-a" style="margin:0">${btn(`data-do="themaAnlegen"`, "Anlegen", "primary")}</div>`);
  }

  // ---------------------------------------------------------------- Klausuren
  // Der Fixpunkt, auf den alles zuläuft. Eine Klausur rechnet rückwärts: sie zeigt
  // nicht nur, wann sie ist, sondern wie weit die Themen ihres Moduls sind.
  function klausuren() {
    return (S.klausuren || [])
      .filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k.datum || ""))
      .map((k) => ({ ...k, art: "klausur", titel: k.fach || "Klausur", tage: tageBis(k.datum) }))
      .filter((k) => k.tage >= -1)                        // gestern ist noch interessant, vorletzte Woche nicht
      .sort((a, b) => a.tage - b.tage);
  }

  // Welche Themen zu einer Klausur gehören. Ein Fach hat mehrere Module — die
  // Mathe-Klausur prüft Algebraische Grundlagen, Lineare Algebra und Analysis —
  // deshalb zählt die Modulliste, und das Fach nur, wenn es selbst als Modul auftritt.
  function klausurThemen(k) {
    const namen = new Set([...(Array.isArray(k.module) ? k.module : []), k.fach].filter(Boolean));
    return themen().filter((t) => t.modul && namen.has(t.modul))
      .sort((a, b) => String(a.modul).localeCompare(String(b.modul)) || (a.reihenfolge || 0) - (b.reihenfolge || 0));
  }

  // Reife: wo diese Themen im Intervall-Stapel stehen, 0 bis 1.
  function klausurStand(k) {
    const T = klausurThemen(k);
    if (!T.length) return null;
    const oben = INTERVALLE.length - 1;
    return { anzahl: T.length, faellig: T.filter((t) => t.tage <= 0).length,
      reife: T.reduce((s, t) => s + t.stufe, 0) / (T.length * oben) };
  }

  const klausurTon = (k) => k.tage < 0 ? "satt" : k.tage <= 7 ? "alarm" : k.tage <= 21 ? "soon" : "ruhig";
  const klausurWann = (k) => k.tage < 0 ? "vorbei" : k.tage === 0 ? "heute" : k.tage === 1 ? "morgen" : `noch ${k.tage} Tage`;

  function klausurZeile(k, opt = {}) {
    const st = klausurStand(k);
    const farbe = st ? (st.reife > 0.55 ? "var(--ok)" : st.reife > 0.25 ? "var(--soon)" : "var(--alarm)") : "var(--line-2)";
    const meta = [opt.ohneDatum ? "" : langDatum(k.datum), k.uhrzeit || "", k.ort || ""].filter(Boolean).join(" · ");
    return `<div class="z ${klausurTon(k)}"><i></i>
      <div class="z-t"><button type="button" data-do="blatt" data-art="klausur" data-id="${esc(k.id)}">${esc(k.titel)}</button></div>
      <div class="z-r">${esc(klausurWann(k))}</div>
      <div class="z-m">${esc(meta)}${meta && st ? " · " : ""}${st
        ? `${st.anzahl} ${st.anzahl === 1 ? "Thema" : "Themen"}${st.faellig ? `, ${st.faellig} fällig` : ""}
           <span class="bar" style="--c:${farbe}"><b style="width:${Math.round(st.reife * 100)}%"></b></span>`
        : (meta ? " · " : "") + "keine Lernthemen zugeordnet"}</div>
    </div>`;
  }

  function klausurSektion() {
    if (!S.db) return "";
    const K = klausuren();
    if (!K.length) return "";
    const naechste = K.find((k) => k.tage >= 0);
    return sekt("Klausuren", naechste ? klausurWann(naechste) : "",
      `<div class="sekt">${K.slice(0, 4).map((k) => klausurZeile(k)).join("")}</div>`, true);
  }

  async function klausurAnlegen(liste) {
    if (!S.db) { toast("Der Speicher ist in dieser Ansicht nicht verfügbar."); return 0; }
    let n = 0;
    for (const x of liste.slice(0, 10)) {
      const fach = String(x?.fach ?? "").trim().slice(0, 120);
      const datum = String(x?.datum ?? "");
      if (!fach || !/^\d{4}-\d{2}-\d{2}$/.test(datum)) continue;
      try {
        await S.db.doc("klausuren/" + neueId("k")).set({
          fach, datum,
          uhrzeit: /^\d{2}:\d{2}$/.test(String(x?.uhrzeit ?? "")) ? String(x.uhrzeit) : null,
          module: (Array.isArray(x?.module) ? x.module : []).map((m) => String(m).trim()).filter(Boolean).slice(0, 12),
          ort: String(x?.ort ?? "").trim().slice(0, 120) || null,
          notiz: String(x?.notiz ?? "").trim().slice(0, 400) || null,
          angelegt: new Date().toISOString(),
        });
        n++;
      } catch (e) { toast(dbText(e)); break; }
    }
    if (n) toast(n === 1 ? "Klausur steht im Kalender." : `${n} Klausuren stehen im Kalender.`);
    return n;
  }

  async function klausurLoeschen(k) {
    if (!S.db) return false;
    const { tage, art, titel, id, ...rein } = k;
    try {
      await S.db.doc("klausuren/" + k.id).delete();
      toast(`${kurz(k.titel, 30)}: gestrichen.`, async () => {
        try { await S.db.doc("klausuren/" + k.id).set(rein); }
        catch (e) { const s = dbText(e); throw Object.assign(new Error(s), { __text: s }); }
      });
      return true;
    } catch (e) { toast(dbText(e)); return false; }
  }

  function blattKlausurNeu() {
    const mods = moduleMitThemen();
    blattZeigen(`<h3>Klausur eintragen</h3>
      <p>Sie wird zum Fixpunkt: der Kalender zeigt sie, und der Puls rechnet rückwärts, wie weit die Themen ihrer Module sind.</p>
      <div class="felder">
        <div class="feld"><label for="klFach">Fach</label>
          <input id="klFach" list="klFaecher" placeholder="z. B. Mathematik (FOM)" autocomplete="off">
          <datalist id="klFaecher">${module().map((m) => `<option value="${esc(m)}"></option>`).join("")}</datalist></div>
        <div class="feld-reihe">
          <div class="feld"><label for="klDatum">Datum</label><input id="klDatum" type="date"></div>
          <div class="feld"><label for="klZeit">Uhrzeit</label><input id="klZeit" type="time"></div>
        </div>
        <div class="feld"><label for="klOrt">Ort</label><input id="klOrt" placeholder="Raum, Gebäude"></div>
        ${mods.length ? `<div class="feld"><label>Module, die drankommen</label>
          <div class="modwahl">${mods.map((m, i) => `<label class="modzeile" for="klMod${i}">
            <input type="checkbox" id="klMod${i}" data-mod="${esc(m)}"><span>${esc(m)}</span>
            <small>${themen().filter((t) => t.modul === m).length}</small></label>`).join("")}</div></div>` : ""}
      </div>
      <div class="z-a" style="margin:0">${btn(`data-do="klausurAnlegen"`, "Eintragen", "primary")}</div>`);
  }

  // ---------------------------------------------------------------- Kalender
  // Sechs Wochen ab dem Montag dieser Woche — genau das Fenster, das auch
  // geladen wird. Ein Monatsraster wäre die gewohntere Form, würde aber Tage
  // zeigen, für die keine Daten da sind; das wäre eine Lüge mit Gitter.
  const WOCHENTAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
  const KAL_WOCHEN = 6;
  let kalGewaehlt = null;

  const kalStart = () => {
    const n = tagNr(heute());
    return n - ((new Date(n * 864e5).getUTCDay() + 6) % 7);   // zurück auf Montag
  };

  function kalTage() {
    const von = kalStart(), karte = new Map();
    for (let i = 0; i < KAL_WOCHEN * 7; i++) karte.set(isoTag(von + i), { termine: [], aufgaben: [], klausuren: [] });
    for (const e of termine()) karte.get(e.datum)?.termine.push(e);
    for (const t of aufgaben()) if (t.datum && karte.has(t.datum)) karte.get(t.datum).aufgaben.push(t);
    for (const k of klausuren()) if (karte.has(k.datum)) karte.get(k.datum).klausuren.push(k);
    return karte;
  }

  function kalRaster(karte) {
    const von = kalStart(), h = heute(), zellen = [];
    for (let i = 0; i < KAL_WOCHEN * 7; i++) {
      const iso = isoTag(von + i), tag = karte.get(iso), nr = +iso.slice(8, 10);
      const punkte = [
        ...tag.klausuren.map(() => "klausur"),
        ...tag.termine.map((e) => (e.vorlesung ? "vl" : "termin")),
        ...tag.aufgaben.map((t) => (t.labels?.includes("abgabe") ? "alarm" : "aufgabe")),
      ].slice(0, 4);
      const kl = ["kal-tag", iso === h ? "heute" : "", iso < h ? "blass" : "", tag.klausuren.length ? "klausur" : "",
        iso === kalGewaehlt ? "gewaehlt" : "", nr === 1 && i > 0 ? "monatswechsel" : ""].filter(Boolean).join(" ");
      const zahl = punkte.length ? `, ${punkte.length} ${punkte.length === 1 ? "Eintrag" : "Einträge"}` : "";
      zellen.push(`<button type="button" class="${kl}" data-do="kaltag" data-datum="${iso}"
        aria-label="${esc(kurzDatum(iso) + zahl)}"><b>${nr}</b>
        <span class="kal-punkte">${punkte.map((k) => `<i class="${k}"></i>`).join("")}</span></button>`);
    }
    const bis = isoTag(von + KAL_WOCHEN * 7 - 1);
    return `<div class="kal-kopf"><h2>Sechs Wochen</h2><em>${esc(kurzDatum(isoTag(von)))} – ${esc(kurzDatum(bis))}</em>
      ${S.db ? `<span class="kal-neu">${btn(`data-do="klausurNeu"`, "Klausur", "mini")}</span>` : ""}</div>
      <div class="kal-wochentage">${WOCHENTAGE.map((w) => `<span>${w}</span>`).join("")}</div>
      <div class="kal-gitter">${zellen.join("")}</div>`;
  }

  function kalAgenda(karte) {
    const h = heute(), von = kalStart(), bloecke = [];
    const spaet = aufgaben().filter((t) => t.tage != null && t.tage < 0).sort((a, b) => a.tage - b.tage);
    if (spaet.length) bloecke.push(`<div class="kal-tagblock">
      <div class="kal-datum"><h3>Überfällig</h3><span>${spaet.length} ${spaet.length === 1 ? "Aufgabe" : "Aufgaben"}</span></div>
      <div class="sekt">${spaet.map((t) => zeile(t)).join("")}</div></div>`);

    for (let i = 0; i < KAL_WOCHEN * 7; i++) {
      const iso = isoTag(von + i);
      if (iso < h) continue;                                   // Vergangenes steht oben unter „Überfällig“
      const tag = karte.get(iso);
      const alles = [...tag.termine, ...tag.aufgaben]
        .sort((a, b) => (a.uhrzeit || "99:99").localeCompare(b.uhrzeit || "99:99"));
      if (!alles.length && !tag.klausuren.length && iso !== h) continue;   // leere Tage stehen schon im Raster
      const wann = iso === h ? "heute" : rel(tageBis(iso));
      bloecke.push(`<div class="kal-tagblock${iso === h ? " ist-heute" : ""}" id="kal-${iso}">
        <div class="kal-datum"><h3>${esc(langDatum(iso))}</h3><span>${esc(wann)}</span></div>
        ${tag.klausuren.length || alles.length
          ? `<div class="sekt">${tag.klausuren.map((k) => klausurZeile(k, { ohneDatum: true })).join("")
             }${alles.map((x) => zeile(x, { ohneDatum: true })).join("")}</div>`
          : leer("Heute steht nichts an.")}</div>`);
    }
    return bloecke.length ? `<div class="kal-tage">${bloecke.join("")}</div>`
      : leer("In den nächsten sechs Wochen steht nichts.");
  }

  function renderKalender() {
    if (blick !== "kalender") return;
    const r = $("#kalRaster"), a = $("#kalAgenda");
    if (!S.caps) { r.innerHTML = ""; a.innerHTML = leer("Verbinde mit Todoist und Kalender …"); return; }
    if (ohneLive()) { r.innerHTML = ""; a.innerHTML = leer("Termine und Aufgaben hängen an Deiner Claude-Anmeldung. Öffne die Seite in claude.ai."); return; }
    const karte = kalTage();
    r.innerHTML = kalRaster(karte);
    a.innerHTML = kalAgenda(karte);
  }

  // ---------------------------------------------------------------- Unterfenster
  // Ein Blatt ist ein Gegenstand: am Griff nach unten schieben legt es weg.
  // Damit liegt Schließen immer unter dem Daumen, egal wie lang der Inhalt ist.
  function sheetZiehen(el, griff, schliessen) {
    let start = null, dy = 0, los = 0;
    griff.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".sheet-zu")) return;
      start = e.clientY; dy = 0; los = performance.now();
      try { griff.setPointerCapture(e.pointerId); } catch (x) { /* egal */ }
      el.classList.add("zieht");
    });
    griff.addEventListener("pointermove", (e) => {
      if (start == null) return;
      dy = Math.max(0, e.clientY - start);
      el.style.transform = `translateY(${dy}px)`;
    });
    const hoch = () => {
      if (start == null) return;
      const schwung = dy > 26 && performance.now() - los < 320;   // kurzer Wisch reicht
      start = null;
      el.classList.remove("zieht");
      if (dy > 90 || schwung) {
        el.style.transform = "translateY(100%)";
        setTimeout(() => { el.style.transform = ""; schliessen(); }, ruhig ? 0 : 200);
      } else el.style.transform = "";
    };
    griff.addEventListener("pointerup", hoch);
    griff.addEventListener("pointercancel", hoch);
  }

  // ---------------------------------------------------------------- Jarvis
  // Der Chat ist der zweite Eingang ins selbe Gehirn. Er liest dieselbe Lage,
  // schreibt über dieselben Funktionen wie jeder Knopf im Puls und hinterlässt
  // damit dieselben Rückgängig-Hinweise. Was er tut, ist also nie eine
  // Sonderbehandlung — es ist derselbe Griff, nur mit Worten ausgelöst.
  const jLog = $("#jarvisLog"), jForm = $("#jarvisForm"), jFeld = $("#jarvisFeld"), jSenden = $("#jarvisSenden");
  let jTurns = [], jCtl = null, jLaeuft = false, jAktiv = null, jToolsOk = false, jGeladen = false;

  const jUnten = () => { jLog.scrollTop = jLog.scrollHeight; };
  const jSpeichern = () => {
    if (!S.db) return;

  };

  function jBlase(wer, text) {
    jLog.querySelector(".j-start")?.remove();

  // Während Claude arbeitet, sagt jeder Griff Bescheid — sonst sieht eine
  // Runde mit drei Werkzeugen aus wie eine Minute Stillstand.
  const WERKZEUG_WORT = { aufgaben_erledigen: "hakt ab", verschieben: "verschiebt", anlegen: "legt an",
    thema_wiederholt: "Gedächtnis", thema_anlegen: "merkt sich", klausur_anlegen: "Klausur",

  function jStart() {
    jLog.innerHTML = "";

  // ---- Die Lage: derselbe Auszug, den auch das Eingabefeld oben schickt.
  function jarvisLage() {
    const n = berlin();
    const wd = new Intl.DateTimeFormat("de-DE", { weekday: "long", timeZone: TZ }).format(new Date());
    const L = [];
    L.push("Du bist Jarvis, das Assistenz-Gehirn eines Studenten an der FOM. Sprich Deutsch und duze ihn.",
      "Fass Dich kurz. Er steht zwischen zwei Vorlesungen, nicht vor einem Aufsatz — zwei, drei Sätze reichen meistens.",
      "Handle über Deine Werkzeuge, statt ihm zu erklären, was er selbst klicken soll. Jede Änderung kann er unten im Hinweis zurücknehmen, also frag nicht lange nach.",
      "Was nicht in der LAGE steht, weißt Du nicht: erfinde keine Aufgaben, Termine oder ids.",
      `Jetzt: ${wd}, ${n.date}, ${n.time} Uhr (Europe/Berlin).`, "");

    const Sek = sektionen();
    if (Sek.length) L.push("FÄCHER (exakte Namen):", ...Sek.map((s) => "- " + s.name), "");

    const A = aufgaben().sort((a, b) => (a.tage ?? 999) - (b.tage ?? 999)).slice(0, 30);
    L.push("OFFENE AUFGABEN (id | titel | fällig | fach):",
      ...(A.length ? A.map((t) => `- ${t.id} | ${kurz(t.titel, 70)} | ${t.datum ? t.datum + (t.uhrzeit ? " " + t.uhrzeit : "") : "ohne Datum"} | ${t.sektion?.name || "-"}`)
        : ["(keine)"]), "");

    const T = termine().slice(0, 15);
    L.push("TERMINE (id | datum | zeit | titel):",
      ...(T.length ? T.map((e) => `- ${e.id} | ${e.datum} | ${e.uhrzeit || "ganztägig"} | ${kurz(e.titel, 50)}${e.vorlesung ? " [Vorlesung, nicht verschiebbar]" : ""}`)
        : ["(keine)"]), "");

    const TH = themenAktiv().slice(0, 20);
    if (TH.length) L.push("LERNTHEMEN (id | thema | modul | fällig am):",
      ...TH.map((t) => `- ${t.id} | ${t.name} | ${t.modul || "-"} | ${t.faellig}`), "");
    const alleMod = moduleMitThemen();
    if (alleMod.length) L.push("MODULE (auch noch nicht laufende): " + alleMod.join(", "), "");

    const K = klausuren();
    if (K.length) L.push("KLAUSUREN (fach | datum | in Tagen):",
      ...K.map((k) => `- ${k.fach} | ${k.datum}${k.uhrzeit ? " " + k.uhrzeit : ""} | ${k.tage}`), "");

    const ids = planIds();
    if (S.db) L.push("DREI FÜR HEUTE:", ...(ids.length ? ids.map((id) => "- " + id) : ["(noch nichts gewählt)"]), "");

    if (S.zustand) {
      L.push("RECHNER:", `- Stand ${S.zustand.stand}`,
        `- Downloads: ${S.zustand.downloads?.dateien ?? "?"} Dateien`,
        ...warnungen().slice(0, 4).map((w) => `- Warnung: ${w.titel} (${w.detail || ""})`), "");
    }

    L.push("REGELN:",
      '- "Termin" ist etwas mit fester Zeit, zu dem er irgendwo sein muss. Alles zu Erledigende ist eine "Aufgabe", auch mit Frist. Anrufe und Nachrichten sind Aufgaben.',
      '- Relative Angaben ("Freitag", "morgen", "nächste Woche") rechnest Du in ein konkretes Datum ab heute um.',
      `- Labels nur aus: ${LABELS_ERLAUBT.join(", ")}.`,
      "- Fächer nur mit exaktem Namen aus FÄCHER, sonst ohne Fach.",
      "- Vorlesungen und ganztägige Termine verschiebt diese Seite nicht.",
      "- Gibt die Lage etwas nicht her, sag das, statt zu raten.");
    return L.join("\n").slice(0, 12000);
  }

  // ---- Werkzeuge: jedes ruft genau die Funktion, an der auch ein Knopf hängt.
  function jarvisTools() {
    const T = [];
    const txt = (s) => String(s ?? "");

    if (S.mcp) {
      T.push({
        name: "aufgaben_erledigen",

        inputSchema: { type: "object", properties: {
          ids: { type: "array", items: { type: "string" }, description: "ids aus OFFENE AUFGABEN" } }, required: ["ids"] },
        async execute({ ids }) {
          jChip("aufgaben_erledigen");
          const liste = (Array.isArray(ids) ? ids : []).map((id) => findeSache("aufgabe", txt(id))).filter(Boolean);
          if (!liste.length) return "Keine dieser ids ist eine offene Aufgabe.";
          let n = 0;
          for (const t of liste) if (await erledigen(t)) n++;
          return `${n} von ${liste.length} abgehakt.`;
        },
      });

      T.push({
        name: "verschieben",
        description: "Verschiebt eine Aufgabe oder einen Termin auf ein neues Datum. Das bewegt die echte Frist. Vorlesungen und ganztägige Termine gehen nicht.",
        inputSchema: { type: "object", properties: {
          art: { type: "string", enum: ["aufgabe", "termin"] },
          id: { type: "string" },
          datum: { type: "string", description: "YYYY-MM-DD" },
          uhrzeit: { type: "string", description: "HH:MM, optional; bei Terminen bleibt sonst die alte Zeit" },
        }, required: ["art", "id", "datum"] },
        async execute({ art, id, datum, uhrzeit }) {
          jChip("verschieben");
          const a = txt(art) === "termin" ? "termin" : "aufgabe";
          const x = findeSache(a, txt(id));
          if (!x) return "Diese id steht nicht in der Lage.";
          if (!/^\d{4}-\d{2}-\d{2}$/.test(txt(datum))) return "datum muss YYYY-MM-DD sein.";
          const u = /^\d{2}:\d{2}$/.test(txt(uhrzeit)) ? txt(uhrzeit) : (a === "termin" ? x.uhrzeit : null);
          if (a === "termin" && !u) return "Ohne Uhrzeit verschiebt diese Seite keinen Termin.";
          return (await verschieben(x, { datum: txt(datum), uhrzeit: u })) ? "Verschoben." : "Hat nicht geklappt.";
        },
      });

      T.push({
        name: "anlegen",
        description: "Legt Aufgaben in Todoist und Termine im Kalender an. Höchstens 10 auf einmal. Gibt zurück, was durchging und was nicht.",
        inputSchema: { type: "object", properties: {
          eintraege: { type: "array", items: { type: "object", properties: {
            art: { type: "string", enum: ["aufgabe", "termin"] },
            titel: { type: "string" },
            datum: { type: "string", description: "YYYY-MM-DD" },
            uhrzeit: { type: "string", description: "HH:MM" },
            dauerMin: { type: "number", description: "nur bei Terminen, Standard 60" },
            fach: { type: "string", description: "exakter Name aus FÄCHER" },
            labels: { type: "array", items: { type: "string" } },
          }, required: ["art", "titel"] } },
        }, required: ["eintraege"] },
        async execute({ eintraege }) {
          jChip("anlegen");
          const liste = (Array.isArray(eintraege) ? eintraege : []).slice(0, 10).map(normVorschlag).filter(Boolean);
          if (!liste.length) return "Da war nichts Anlegbares dabei.";
          const { fertig, schief } = await anlegenKern(liste);
          const gut = fertig.map((p) => p.titel).join("; ");
          const boese = schief.map((f) => `${f.p.titel}: ${f.warum}`).join("; ");
          return `${fertig.length} angelegt${gut ? " (" + kurz(gut, 160) + ")" : ""}.${schief.length ? ` Nicht geklappt: ${kurz(boese, 200)}` : ""}`;
        },
      });
    }

    if (S.db) {
      T.push({
        name: "thema_wiederholt",
        description: "Setzt ein Lernthema in der Wiederholungs-Queue weiter. art: 'wiederholt' = normal eine Stufe, 'sitzt' = zwei Stufen, 'morgen' = morgen nochmal.",
        inputSchema: { type: "object", properties: {
          id: { type: "string", description: "id aus LERNTHEMEN" },
          art: { type: "string", enum: ["wiederholt", "sitzt", "morgen"] },
        }, required: ["id"] },
        async execute({ id, art }) {
          jChip("thema_wiederholt");
          const t = findeSache("thema", txt(id));
          if (!t) return "Dieses Thema steht nicht in der Lage.";
          const a = ["wiederholt", "sitzt", "morgen"].includes(txt(art)) ? txt(art) : "wiederholt";
          return (await wiederholen(t, a)) ? "Gemerkt." : "Hat nicht geklappt.";
        },
      });

      T.push({
        name: "thema_anlegen",
        description: "Legt Lernthemen ins Gedächtnis. Sie sind sofort fällig und kommen dann nach 1, 3, 7, 16 und 35 Tagen wieder. Ein Thema ist eine Sache, die man abfragen kann, kein Arbeitsauftrag.",
        inputSchema: { type: "object", properties: {
          themen: { type: "array", items: { type: "object", properties: {
            name: { type: "string" },
            modul: { type: "string", description: "exakter Name aus FÄCHER, sonst weglassen" },
          }, required: ["name"] } } }, required: ["themen"] },
        async execute({ themen: liste }) {
          jChip("thema_anlegen");
          const n = await themaAnlegen(Array.isArray(liste) ? liste : []);
          return n ? `${n} ins Gedächtnis gelegt, heute zum ersten Mal fällig.` : "Nichts angelegt.";
        },
      });

      T.push({
        name: "klausur_anlegen",
        description: "Trägt eine Klausur ein. Sie wird zum Fixpunkt: der Puls rechnet rückwärts, wie weit die Lernthemen dieses Fachs sind.",
        inputSchema: { type: "object", properties: {
          fach: { type: "string", description: "möglichst exakter Name aus FÄCHER" },
          datum: { type: "string", description: "YYYY-MM-DD" },
          uhrzeit: { type: "string", description: "HH:MM, optional" },
          ort: { type: "string", description: "Raum oder Gebäude, optional" },
          module: { type: "array", items: { type: "string" },
            description: "Module, die drankommen — exakte Namen aus MODULE. Ein Fach hat oft mehrere." },
        }, required: ["fach", "datum"] },
        async execute({ fach, datum, uhrzeit, ort, module: mods }) {
          jChip("klausur_anlegen");
          return (await klausurAnlegen([{ fach, datum, uhrzeit, ort, module: mods }]))
            ? "Klausur steht." : "Das Datum muss YYYY-MM-DD sein und ein Fach dabei.";
        },
      });

      T.push({
        name: "tagesplan_setzen",
        description: "Setzt die drei Dinge für heute. Höchstens drei ids aus OFFENE AUFGABEN; eine leere Liste räumt den Plan.",
        inputSchema: { type: "object", properties: {
          ids: { type: "array", items: { type: "string" } } }, required: ["ids"] },
        async execute({ ids }) {
          jChip("tagesplan_setzen");
          const gueltig = (Array.isArray(ids) ? ids : []).map(txt)
            .filter((id) => findeSache("aufgabe", id)).slice(0, PLAN_MAX);
          return (await planSetzen(gueltig)) ? `Tagesplan: ${gueltig.length} von ${PLAN_MAX}.` : "Hat nicht geklappt.";
        },
      });
    }
    return T;
  }

  const jFehler = (e) => e?.code === "tools_unavailable"
    ? "In dieser Ansicht darf ich nur reden, nicht handeln. In claude.ai kann ich auch eintragen."
    : sampleText(e);

  function jKnopf() {
    jSenden.textContent = jLaeuft ? "■" : "↑";
    jSenden.classList.toggle("stopp", jLaeuft);
    jSenden.setAttribute("aria-label", jLaeuft ? "Stopp" : "Senden");
  }

  async function jarvisFragen(text) {
    if (!S.sample) { jBlase("fehler", sampleText({ code: "not_granted" })); return; }

    jTurns.push({ role: "user", content: text });
    jBlase("du", text);

    jLaeuft = true; jKnopf();
    const el = jBlase("jarvis", "");
    const body = el.querySelector(".j-text");
    body.innerHTML = `<span class="denkt"><span class="spark"></span>Denkt nach …</span>`;
    jAktiv = el;

    const ctl = (jCtl = new AbortController());
    denkt = true;
    try {
      // Die Lage ist eine führende user-Runde: sie wird bei jedem Zug neu
      // gebaut, damit Claude nie mit dem Stand von vorgestern antwortet.
      const eingabe = [{ role: "user", content: jarvisLage() }, ...jTurns.slice(-12)];
      const opt = { signal: ctl.signal, cache: false, onText: ({ text: t }) => { body.textContent = t; jUnten(); } };
      if (jToolsOk) {
        const tools = jarvisTools();
        if (tools.length) opt.tools = tools;
      }
      const r = await S.sample(eingabe, opt);
      if (ctl !== jCtl) return;
      body.textContent = r.text + (r.truncated ? " …" : "");
      jTurns.push({ role: "assistant", content: r.text });
      jSpeichern();
    } catch (e) {
      if (ctl !== jCtl) return;
      if (e?.code === "cancelled") {
        if (e.text) { body.textContent = e.text; jTurns.push({ role: "assistant", content: e.text }); }
        else el.remove();
      } else {
        // refused zieht die Teilantwort zurück — dann darf nichts stehen bleiben.
        body.textContent = e?.text ? e.text + "\n\n" + jFehler(e) : jFehler(e);
        if (!e?.text) el.className = "j-turn j-fehler";
      }
    } finally {
      if (ctl === jCtl) { denkt = false; jLaeuft = false; jKnopf(); jAktiv = null; }
    }
    jUnten();
  }

  jForm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (jLaeuft) { jCtl?.abort(); return; }
    const t = jFeld.value.trim();
    if (!t) return;
    jFeld.value = "";
    jFeld.style.height = "auto";
    jarvisFragen(t);
  });
  jFeld.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); jForm.requestSubmit(); }
  });
  jFeld.addEventListener("input", () => {
    jFeld.style.height = "auto";
    jFeld.style.height = Math.min(jFeld.scrollHeight, 160) + "px";
  });
  jLog.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-jvor]");

  // ---------------------------------------------------------------- Live-Anbindung
  function watchTodoist() {
    let projId = null, ab = null;
    const aufProjekt = (ev) => {
      if (ev.type === "error") { S.err.todoist = ev.error; if (AUTHZ.has(ev.error.code)) S.projekt = null; }
      else { S.err.todoist = null; const p = ev.result.payload; S.projekt = typeof p === "string" ? JSON.parse(p) : p; }
      neuZeichnen();
    };
    S.mcp.watchTool("Todoist", "get-overview", {}, (ev) => {
      if (ev.type === "error") {
        S.err.todoist = ev.error;
        if (AUTHZ.has(ev.error.code)) { S.projekt = null; S.projektMeta = null; ab?.(); ab = null; projId = null; }
        return neuZeichnen();
      }
      const p = typeof ev.result.payload === "string" ? JSON.parse(ev.result.payload) : ev.result.payload;
      const proj = (p?.projects || []).find((x) => PROJEKT.test(x.name));
      if (!proj) { S.err.todoist = { code: "no_project" }; S.projekt = null; S.projektMeta = null; return neuZeichnen(); }
      S.projektMeta = proj;
      if (proj.id !== projId) {
        ab?.(); projId = proj.id;
        ab = S.mcp.watchTool("Todoist", "get-overview", { projectId: proj.id }, aufProjekt, { refetchInterval: 120000 });
      }
      neuZeichnen();
    }, { refetchInterval: 900000 });
  }
