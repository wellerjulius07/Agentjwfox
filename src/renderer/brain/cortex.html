  // ================================================================ Raum: das Gehirn
  // three.js wird erst geladen, wenn Du den Gehirn-Blick öffnest. Puls, Kalender
  // und Jarvis funktionieren ohne WebGL, ohne CDN und ohne diese 300 Zeilen.
  let denkt = false;
  const QUELLEN = [
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
  ];
  let laedt = false, kaputt = false, R = null, auswahl = null, ueber = null;

  function canvasFehler(text) {
    kaputt = true;
    const alt = $(".canvasfail");
    if (alt) alt.remove();
    const el = document.createElement("div");
    el.className = "canvasfail";
    el.innerHTML = `<p>${esc(text)}</p><div class="z-a" style="margin:0;justify-content:center">
      ${btn(`data-do="blick" data-blick="puls"`, "Zurück zum Puls", "mini primary")}</div>`;
    $("#canvasLayer").appendChild(el);
  }
  function ladeThree() {
    return new Promise((ok, nein) => {
      if (window.THREE) return ok();
      const versuch = (i) => {
        if (i >= QUELLEN.length) return nein(new Error("keine Quelle"));
        const s = document.createElement("script");
        s.src = QUELLEN[i];
        const uhr = setTimeout(() => { s.onload = s.onerror = null; versuch(i + 1); }, 8000);
        s.onload = () => { clearTimeout(uhr); window.THREE ? ok() : versuch(i + 1); };
        s.onerror = () => { clearTimeout(uhr); versuch(i + 1); };
        document.head.appendChild(s);
      };
      versuch(0);
    });
  }
  function canvasStarten() {
    if (R) { R.aktiv = true; canvasSync(); return; }
    if (laedt || kaputt) return;
    laedt = true;
    ladeThree().then(() => { laedt = false; bauen(); })
      .catch(() => { laedt = false; canvasFehler("Die 3D-Bibliothek ließ sich von keiner Quelle laden. Häufige Ursachen: Inhaltsblocker, schwaches Netz oder die App-Vorschau. Der Puls funktioniert davon unabhängig."); });
  }
  function canvasRuhen() { if (R) R.aktiv = false; }
  function auswahlSetzen(id) { auswahl = id; }

  function bauen() {
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: $("#stage"), antialias: !schmal(), powerPreference: "high-performance" });
    } catch (e) {
      return canvasFehler("WebGL ist in diesem Browser nicht verfügbar. Öffne den Link in Chrome, Brave oder Safari — oder bleib beim Puls, der braucht es nicht.");
    }
    const canvas = $("#stage");
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x15161a, 1);
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x15161a, 0.06);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    const ADD = THREE.AdditiveBlending, WEISS = new THREE.Color("#ffffff");

    const LEUCHTEN = (() => {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d"), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
      r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(.16, "rgba(255,255,255,.9)");
      r.addColorStop(.4, "rgba(255,255,255,.22)"); r.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = r; g.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    })();
    const funkeSprite = (farbe) => new THREE.Sprite(new THREE.SpriteMaterial({ map: LEUCHTEN, color: farbe,
      transparent: true, depthWrite: false, blending: ADD }));

    // Der Körper: eine Punktwolke in Hirnform.
    const N = schmal() ? 6000 : 14000;
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    const knochen = new THREE.Color("#DBD8D1"), kuehl = new THREE.Color("#68758F"), tmp = new THREE.Color();
    for (let i = 0; i < N; i++) {
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      const dx = s * Math.cos(th), dy = u, dz = s * Math.sin(th);
      const haut = Math.random() < 0.78;
      const tief = haut ? 0.94 + Math.random() * 0.06 : Math.pow(Math.random(), 0.6) * 0.9;
      const teil = Math.random();
      let x, y, z;
      if (teil < 0.87) {
        const h = Math.random() < 0.5 ? -1 : 1;
        const k = tief * (1 + 0.05 * Math.sin(dx * 13 + dy * 9) * Math.sin(dz * 11 - dy * 6) + 0.025 * Math.sin(dz * 23 + dx * 17));
        let ox = dx * 0.74 * k;
        if (h * dx < 0) ox *= 0.42;
        x = h * 0.36 + ox; y = dy * 0.85 * k * (dy < -0.3 ? 0.8 : 1); z = dz * 1.25 * k;
      } else if (teil < 0.97) {
        const k = tief * (1 + 0.06 * Math.sin(dy * 26));
        x = dx * 0.62 * k; y = -0.62 + dy * 0.28 * k; z = -0.95 + dz * 0.38 * k;
      } else {
        const t = Math.random();
        x = dx * 0.12; y = -0.55 - t * 0.65; z = -0.5 - t * 0.12 + dz * 0.12;
      }
      pos.set([x, y, z], i * 3);
      tmp.copy(knochen).lerp(kuehl, haut ? Math.random() * 0.35 : 0.5 + Math.random() * 0.5)
        .multiplyScalar(0.55 + Math.random() * 0.45);
      col.set([tmp.r, tmp.g, tmp.b], i * 3);
    }
    const wolkeGeo = new THREE.BufferGeometry();
    wolkeGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    wolkeGeo.setAttribute("color", new THREE.BufferAttribute(col, 3));
    const wolkeMat = new THREE.PointsMaterial({ size: 0.024, map: LEUCHTEN, vertexColors: true,
      transparent: true, opacity: 0.42, depthWrite: false, blending: ADD });
    scene.add(new THREE.Points(wolkeGeo, wolkeMat));

    const labelsEl = $("#labels");
    const lebend = new Map(), kanten = new Map(), vorrat = [], pulse = [];
    let ersterLauf = true;

    function knotenBauen(def) {
      const k = { id: def.id, v: new THREE.Vector3(...def.pos), akt: ersterLauf ? 0 : 1.1, phase: streu(def.id) * 6.28 };
      k.halo = funkeSprite(WEISS); k.kern = funkeSprite(WEISS);
      k.halo.position.copy(k.v); k.kern.position.copy(k.v);
      scene.add(k.halo, k.kern);
      k.lbl = document.createElement("div"); k.lbl.className = "lbl"; labelsEl.appendChild(k.lbl);
      return k;
    }
    function knotenSetzen(k, def) {
      const bewegt = def.pos.some((v, i) => Math.abs(v - k.v.getComponent(i)) > 1e-4);
      Object.assign(k, { label: def.label, farbe: def.farbe, ton: def.ton, w: def.w, major: def.major,
        art: def.art, ref: def.ref, glanz: def.glanz ?? 1 });
      if (bewegt) { k.v.set(...def.pos); k.halo.position.copy(k.v); k.kern.position.copy(k.v); }
      k.hex = def.ton === "alarm" ? "#D9645A" : def.ton === "soon" ? "#D9A441" : def.farbe;
      const c = new THREE.Color(k.hex);
      k.halo.material.color.copy(c); k.kern.material.color.copy(c).lerp(WEISS, 0.6);
      k.basis = 0.055 * (def.w || 1);
      k.lbl.textContent = def.label;
      k.lbl.classList.toggle("major", !!def.major);
      k.lbl.classList.toggle("alarm", def.ton === "alarm");
      k.lblW = null;
      return bewegt;
    }
    function knotenWeg(k) {
      scene.remove(k.halo, k.kern);
      k.halo.material.dispose(); k.kern.material.dispose(); k.lbl.remove();
      lebend.delete(k.id);
    }
    const kantenId = (a, b) => (a < b ? a + "|" + b : b + "|" + a);
    function kanteBauen(id, A, B) {
      const mitte = A.v.clone().add(B.v).multiplyScalar(0.5);
      const schub = mitte.lengthSq() < 0.01 ? new THREE.Vector3(0, 1, 0) : mitte.clone().normalize();
      const kurve = new THREE.QuadraticBezierCurve3(A.v.clone(),
        mitte.add(schub.multiplyScalar(0.1 + 0.14 * A.v.distanceTo(B.v))), B.v.clone());
      const pts = kurve.getPoints(28);
      const g = new THREE.BufferGeometry().setFromPoints(pts);
      g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(pts.length * 3), 3));
      const mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.12,
        depthWrite: false, blending: ADD });
      const line = new THREE.Line(g, mat);
      scene.add(line);
      const e = { id, a: A, b: B, kurve, mat, line, op: 0.12, hitze: 0 };
      kanteFaerben(e);
      return e;
    }
    function kanteFaerben(e) {
      const attr = e.line.geometry.getAttribute("color"), n = attr.count;
      const ca = new THREE.Color(e.a.hex), cb = new THREE.Color(e.b.hex), c = new THREE.Color();
      for (let i = 0; i < n; i++) { c.copy(ca).lerp(cb, i / (n - 1)); attr.setXYZ(i, c.r, c.g, c.b); }
      attr.needsUpdate = true;
    }
    function kanteWeg(id) {
      const e = kanten.get(id);
      if (!e) return;
      scene.remove(e.line); e.line.geometry.dispose(); e.mat.dispose(); kanten.delete(id);
      for (const p of pulse) if (p.e === e) p.tot = true;
    }

    // ---- Was im Raum liegt: 16 Organe (Struktur) oder die Live-Einträge (Zeit)
    const jitter = (id, s) => (streu(id) - 0.5) * 2 * s;
    function defsGehirn() {
      return ORGANE.map((o) => {
        const n = organZahl(o);
        return { id: "organ:" + o.id, label: o.name + (n == null ? "" : "  " + zahl(n)), pos: o.pos,
          farbe: o.farbe, ton: organWarn(o) ? "alarm" : null, w: o.gross ? 1.5 : 1.15, major: true,
          art: "organ", ref: o.id, glanz: n ? 1 : 0.55 };
      });
    }
    function sync() {
      const defs = defsGehirn();
      const gesehen = new Set(), bewegt = new Set();
      for (const def of defs) {
        gesehen.add(def.id);
        let k = lebend.get(def.id);
        if (!k) { k = knotenBauen(def); lebend.set(def.id, k); knotenSetzen(k, def); }
        else if (knotenSetzen(k, def)) bewegt.add(def.id);
      }
      for (const k of [...lebend.values()]) if (!gesehen.has(k.id)) knotenWeg(k);
      for (const k of lebend.values()) k.nachbarn = [];

      const gewollt = new Set();
      {
        for (const [a, b] of KANTEN) {
          const A = lebend.get("organ:" + a), B = lebend.get("organ:" + b);
          if (!A || !B) continue;
          const id = kantenId(A.id, B.id);
          gewollt.add(id);
          if (kanten.has(id) && (bewegt.has(A.id) || bewegt.has(B.id))) kanteWeg(id);
          if (!kanten.has(id)) kanten.set(id, kanteBauen(id, A, B));
          else kanteFaerben(kanten.get(id));
        }
      }
      for (const id of [...kanten.keys()]) if (!gewollt.has(id)) kanteWeg(id);
      for (const e of kanten.values()) { e.a.nachbarn.push(e); e.b.nachbarn.push(e); }
      ersterLauf = false;
    }

    function puls(e, von, { dauer = 1200, stark = 1, ziel } = {}) {
      const vor = e.a === von, sprites = [];
      for (let i = 0; i < 4; i++) {
        const sp = vorrat.pop() || funkeSprite(WEISS);
        sp.material.color.set(von.hex).lerp(WEISS, i === 0 ? 0.5 : 0.1);
        sp.visible = true; scene.add(sp); sprites.push(sp);
      }
      e.hitze = Math.max(e.hitze, stark);
      pulse.push({ e, vor, t: 0, dauer, stark, sprites, ziel: vor ? e.b : e.a });
    }
    function anstossen(organId, stark = 1.3) {
      const k = lebend.get("organ:" + organId);
      if (!k) return;
      k.akt = 1.6;
      if (!ruhig) (k.nachbarn || []).forEach((e, i) =>
        setTimeout(() => kanten.has(e.id) && puls(e, k, { dauer: 900, stark }), i * 60));
    }

    // ---- Kamera und Zeigen
    let gier = 0.7, neig = 0.2, weit = schmal() ? 7.2 : 5.4, gierZ = gier, neigZ = neig, weitZ = weit, letzte = -1e9;
    const zeiger = new Map();
    let runter = null, zoom0 = 0;
    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
      runter = { x: e.clientX, y: e.clientY };
      if (zeiger.size === 2) { const [p, q] = [...zeiger.values()]; zoom0 = Math.hypot(p.x - q.x, p.y - q.y); }
      canvas.classList.add("dragging"); letzte = performance.now();
    });
    canvas.addEventListener("pointermove", (e) => {
      const p = zeiger.get(e.pointerId);
      if (!p) { ueber = treffer(e.clientX, e.clientY); canvas.classList.toggle("hovering", !!ueber); return; }
      if (zeiger.size === 2) {
        p.x = e.clientX; p.y = e.clientY;
        const [a, b] = [...zeiger.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
        if (zoom0) weitZ = clamp(weitZ * (zoom0 / d), 2.6, 9);
        zoom0 = d;
      } else {
        gierZ -= (e.clientX - p.x) * 0.006;
        neigZ = clamp(neigZ + (e.clientY - p.y) * 0.004, -1.2, 1.2);
        p.x = e.clientX; p.y = e.clientY;
      }
      letzte = performance.now();
    });
    const hoch = (e) => {
      zeiger.delete(e.pointerId);
      canvas.classList.remove("dragging");
      if (runter && zeiger.size === 0 && Math.hypot(e.clientX - runter.x, e.clientY - runter.y) < 8) {
        const k = treffer(e.clientX, e.clientY);
        if (k) waehlen(k);
        else if (!blatt.hidden) blattZu();
      }
      runter = null;
    };
    canvas.addEventListener("pointerup", hoch);
    canvas.addEventListener("pointercancel", hoch);
    canvas.addEventListener("wheel", (e) => { e.preventDefault(); weitZ = clamp(weitZ * (1 + e.deltaY * 0.001), 2.6, 9); letzte = performance.now(); }, { passive: false });

    const pv = new THREE.Vector3();
    const aufSchirm = (v) => { pv.copy(v).project(camera); return { x: (pv.x * .5 + .5) * innerWidth, y: (-pv.y * .5 + .5) * innerHeight, z: pv.z }; };
    // Getroffen wird großzügig: 44 px sind eine Daumenkuppe, 3 px sind ein Münzwurf.
    function treffer(x, y) {
      let best = null, bestD = Infinity;
      for (const k of lebend.values()) {
        const s = aufSchirm(k.v);
        if (s.z > 1) continue;
        const d = Math.hypot(s.x - x, s.y - y);
        if (d <= Math.max(44, k.basis * 320) && d < bestD) { best = k; bestD = d; }
      }
      return best;
    }
    function waehlen(k) {
      auswahl = k.id;
      k.akt = 1.5;
      if (k.art === "organ") { blattOrgan(k.ref); anstossen(k.ref, 0.9); }
      else if (k.art === "lauf") {
        const r = (S.zustand?.laeufe || []).find((x) => x.id === k.ref);
        if (r) blattZeigen(`<h3>${esc(r.gruppe)}${r.typ === "plan" ? " · Trockenlauf" : ""}</h3>
          ${fakten([["Wann", esc(stempel(r.zeit))], ["Zeilen", esc(zahl(r.zeilen))], ["Datei", esc(r.datei)]])}
          <p>Zurückholen geht über das Protokoll in logs\\. Sag im Chat, welchen Lauf Du rückgängig machen willst.</p>`);
      } else if (k.art === "takt") {
        blattOrgan("takt");
      } else blattSache(k.art, k.ref);
    }

    // ---- Beschriftungen: im Gehirn immer alle 16, in der Bahn die vordersten ohne Überlappung
    function labelsSetzen() {
      const kandidaten = [];
      for (const k of lebend.values()) {
        const s = aufSchirm(k.v);
        k.sicht = s;
        if (s.z > 1 || !k.label) { k.lbl.classList.toggle("on", false); k.lblAn = false; continue; }
        kandidaten.push(k);
      }
      kandidaten.sort((a, b) => a.sicht.z - b.sicht.z);
      const belegt = [], max = blick === "gehirn" ? 16 : (schmal() ? 9 : 16);
      let gesetzt = 0;
      for (const k of kandidaten) {
        if (k.lblW == null) { k.lblW = k.lbl.offsetWidth; k.lblH = k.lbl.offsetHeight || 18; }
        const w = k.lblW, h = k.lblH, luft = 8 + k.basis * 50;
        const x = k.sicht.x - w / 2, y = k.sicht.y - h - luft;
        const drin = x >= 6 && y >= 6 && x + w <= innerWidth - 6 && y + h <= innerHeight - 6;
        const frei = drin && !belegt.some((r) => x < r.x + r.w + 4 && x + w + 4 > r.x && y < r.y + r.h + 4 && y + h + 4 > r.y);
        const zeigen = frei && (gesetzt < max || k.id === auswahl || k === ueber);
        if (zeigen) {
          belegt.push({ x, y, w, h }); gesetzt++;
          k.lbl.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
          k.lbl.classList.toggle("back", k.sicht.z > 0.55 && k.id !== auswahl && k !== ueber);
          k.lbl.classList.toggle("sel", k.id === auswahl);
          if (k.id === auswahl) k.lbl.style.setProperty("--c", k.hex);
        }
        if (zeigen !== !!k.lblAn) { k.lbl.classList.toggle("on", zeigen); k.lblAn = zeigen; }
      }
    }

    function groesse() {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      for (const k of lebend.values()) k.lblW = null;
    }
    addEventListener("resize", groesse);
    groesse();
    sync();

    let vorher = performance.now();
    function frame(jetzt) {
      const dt = Math.min(0.05, (jetzt - vorher) / 1000);
      vorher = jetzt;
      const zeit = jetzt / 1000;
      if (!R.aktiv) { requestAnimationFrame(frame); return; }
      if (!ruhig && jetzt - letzte > 4000 && zeiger.size === 0 && !auswahl) gierZ += dt * 0.05;
      gier += (gierZ - gier) * Math.min(1, dt * 5);
      neig += (neigZ - neig) * Math.min(1, dt * 5);
      weit += (weitZ - weit) * Math.min(1, dt * 5);
      camera.position.set(weit * Math.cos(neig) * Math.sin(gier), weit * Math.sin(neig), weit * Math.cos(neig) * Math.cos(gier));
      camera.lookAt(0, -0.02, 0);
      wolkeMat.opacity = 0.44 + (ruhig ? 0 : 0.05 * Math.sin(zeit * 0.7)) + (denkt ? 0.08 : 0);

      for (const k of lebend.values()) {
        k.akt *= Math.exp(-dt * 1.5);
        const gewaehlt = k.id === auswahl, alarm = k.ton === "alarm";
        const atmen = ruhig ? 1 : 1 + (alarm ? 0.2 : 0.06) * Math.sin(zeit * (alarm ? 3.2 : 1.4) + k.phase);
        const a = k.akt + (gewaehlt ? 0.55 : 0) + (k === ueber ? 0.35 : 0);
        const g = k.glanz ?? 1;
        k.halo.scale.setScalar(k.basis * 4.2 * (0.55 + 0.45 * g) * (1 + a * 1.3) * atmen);
        k.halo.material.opacity = Math.min(1, 0.14 + 0.24 * g + a * 0.55);
        k.kern.scale.setScalar(k.basis * (1.1 + a * 0.5));
        k.kern.material.opacity = 0.35 + 0.6 * g;
      }
      labelsSetzen();

      for (const e of kanten.values()) {
        e.hitze *= Math.exp(-dt * 2.2);
        let t = 0.13;
        if (auswahl) t = e.a.id === auswahl || e.b.id === auswahl ? 0.6 : 0.06;
        e.op += (t - e.op) * Math.min(1, dt * 5);
        e.mat.opacity = Math.min(1, e.op + e.hitze * 0.35);
      }
      for (let i = pulse.length - 1; i >= 0; i--) {
        const p = pulse[i];
        p.t += (dt * 1000) / p.dauer;
        if (!p.tot) p.sprites.forEach((sp, j) => {
          const tt = clamp(p.t - j * 0.03, 0, 1);
          p.e.kurve.getPoint(p.vor ? tt : 1 - tt, sp.position);
          const ab = 1 - j / 4;
          sp.scale.setScalar((j === 0 ? 0.09 : 0.06) * ab * (0.6 + p.stark * 0.5));
          sp.material.opacity = ab * Math.min(1, p.stark) * Math.sin(Math.PI * Math.min(1, p.t)) * 0.9;
        });
        if (p.tot || p.t >= 1.1) {
          if (!p.tot && p.ziel) p.ziel.akt = Math.max(p.ziel.akt, 0.9);
          p.sprites.forEach((sp) => { sp.visible = false; scene.remove(sp); vorrat.push(sp); });
          pulse.splice(i, 1);
        }
      }
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    R = { aktiv: true, sync, anstossen };
    requestAnimationFrame(frame);
  }

  function canvasSync() { if (R && R.aktiv) R.sync(); }
  function funke(organId) { if (R && R.aktiv && blick === "gehirn") R.anstossen(organId); }

  // ---------------------------------------------------------------- Start
  blickSetzen((location.hash || "").replace("#", "") || "puls");
  renderPuls(); renderStatus();
  sheetZiehen($("#blatt"), $("#blattGriff"), blattZu);
  sheetZiehen($("#organe"), $("#organeGriff"), () => organeZeigen(false));

  (async () => {
    const hol = (n) => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
    const [mcp, db, sample] = await Promise.all([hol("mcp"), hol("db"), hol("sample")]);
    Object.assign(S, { mcp, db, sample, caps: true });
    if (!db) S.tafelStand = {};
    if (mcp) { watchTodoist(); watchKalender(); }
    if (db) dbAbo(); else jGeladen = true;
    jarvisStart();
    if (blick === "jarvis" && !jLog.childElementCount && jGeladen) jarvisAufbauen();
    neuZeichnen();
  })();

})();
</script>
