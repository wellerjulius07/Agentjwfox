<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Semester-Cortex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Semester-Cortex — Papier und Tinte. Ruhig, typografisch, ohne Leuchten.
     Zwei Themes aus einem Satz Tokens; die beiden Raumblicke behalten ihre
     dunkle Bühne, weil eine Punktwolke nur auf Dunkel existiert.
     Die Tokennamen sind historisch: --void ist der Grund, --bone die Schrift. */
  :root{
    --void:#FCFCFA; --shell:#FFFFFF; --raise:#F2F2EF;
    --bone:#1A1B1D; --bone-2:#54565C; --mist:#8B8D93; --faint:#A9AAAE;
    --synapse:#2D5D8F; --synapse-2:#244C77; --on-synapse:#FFFFFF;
    --alarm:#A83A31; --soon:#8A6212; --ok:#2F6B45;
    --line:#E3E3DE; --line-2:#CFCFC9; --hover:#F2F2EF;
    --glass:#FFFFFF;
    --scrim:rgba(26,27,29,.34);
    --schatten:0 6px 24px rgba(26,27,29,.10);
    --toast:#26272B; --toast-ink:#F5F4F1; --toast-line:rgba(245,244,241,.24);
    /* Die Bühne der Raumblicke — themenunabhängig, sie ist immer Nacht. */
    --slate:#15161A; --slate-ink:#E6E5E1; --slate-mist:#8B8D95;
    --slate-line:rgba(230,229,225,.14); --slate-line-2:rgba(230,229,225,.26);
    --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    --f-display:var(--f-body);
    --r:4px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --void:#17181B; --shell:#1D1E22; --raise:#24262A;
      --bone:#E8E7E3; --bone-2:#B2B2AE; --mist:#85868D; --faint:#63656B;
      --synapse:#8FB6DD; --synapse-2:#A8C6E6; --on-synapse:#14161A;
      --alarm:#E28078; --soon:#D2A24E; --ok:#74BE92;
      --line:#2A2C31; --line-2:#3B3E45; --hover:#24262A;
      --glass:#1D1E22;
      --scrim:rgba(8,9,11,.62);
      --schatten:0 6px 24px rgba(0,0,0,.42);
      --toast:#2E3036; --toast-ink:#E8E7E3; --toast-line:rgba(232,231,227,.22);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --void:#17181B; --shell:#1D1E22; --raise:#24262A;
    --bone:#E8E7E3; --bone-2:#B2B2AE; --mist:#85868D; --faint:#63656B;
    --synapse:#8FB6DD; --synapse-2:#A8C6E6; --on-synapse:#14161A;
    --alarm:#E28078; --soon:#D2A24E; --ok:#74BE92;
    --line:#2A2C31; --line-2:#3B3E45; --hover:#24262A;
    --glass:#1D1E22;
    --scrim:rgba(8,9,11,.62);
    --schatten:0 6px 24px rgba(0,0,0,.42);
    --toast:#2E3036; --toast-ink:#E8E7E3; --toast-line:rgba(232,231,227,.22);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{height:100%;margin:0;background:var(--void);color:var(--bone);
    font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  h1,h2,h3,h4{text-wrap:balance}
  :focus-visible{outline:2px solid var(--synapse);outline-offset:2px}

  /* ---------- Bühne ---------- */
  #canvasLayer{position:fixed;inset:0;z-index:0;background:var(--slate)}
  #canvasLayer[hidden]{display:none!important}
  #stage{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #stage.dragging{cursor:grabbing}
  #stage.hovering{cursor:pointer}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse 80% 70% at 50% 46%,transparent 55%,rgba(21,22,26,.72) 100%)}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
  .lbl{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--f-mono);font-size:10.5px;
    color:var(--slate-ink);padding:2px 6px;border-radius:3px;background:rgba(21,22,26,.8);
    border:1px solid var(--slate-line);opacity:0;transition:opacity .2s}
  .lbl.on{opacity:1}
  .lbl.back{opacity:.4}
  .lbl.major{font-weight:600}
  .lbl.alarm{color:#F0B5AE;border-color:rgba(217,100,90,.5)}
  .lbl.sel{border-color:var(--c,var(--slate-line-2))}
  .canvasfail{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
    width:min(400px,calc(100% - 32px));padding:20px;border-radius:var(--r);
    background:var(--shell);border:1px solid var(--line);text-align:center;box-shadow:var(--schatten)}
  .canvasfail p{margin:0 0 14px;color:var(--bone-2);font-size:13.5px}

  #shell{position:relative;z-index:4;min-height:100%;display:flex;flex-direction:column;
    pointer-events:none}
  #shell > *{pointer-events:auto}
  body[data-blick="puls"]{overflow-y:auto}
  body:not([data-blick="puls"]){overflow:hidden}

  /* ---------- Kopf ---------- */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;
    background:var(--void);border-bottom:1px solid var(--line);padding:13px 16px 0}
  .top-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:11px}
  .brand{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .brand h1{font-weight:600;font-size:16px;letter-spacing:-.012em;margin:0}
  .brand h1 b{font-weight:600;color:var(--bone)}
  .brand time{font-family:var(--f-mono);font-size:10.5px;color:var(--mist);letter-spacing:.03em}

  .ask{display:flex;align-items:center;gap:6px;padding:0 0 0 12px;border-radius:var(--r);
    background:var(--shell);border:1px solid var(--line-2)}
  .ask:focus-within{border-color:var(--synapse)}
  .ask input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--bone);font:inherit;
    font-size:14px;padding:9px 0}
  .ask input::placeholder{color:var(--mist)}
  .ask button{all:unset;cursor:pointer;width:34px;height:34px;margin:2px;border-radius:3px;display:grid;
    place-items:center;background:var(--synapse);color:var(--on-synapse);font-size:15px;font-weight:600;flex:none}
  .ask button:hover{background:var(--synapse-2)}
  .ask button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

  /* Reiter: Text mit Unterstrich statt Segmentschalter. */
  .blicke{display:flex;gap:20px;align-self:flex-start}
  .blicke button{all:unset;cursor:pointer;padding:3px 0 9px;font-size:13px;color:var(--mist);
    border-bottom:2px solid transparent;transition:color .15s}
  .blicke button:hover{color:var(--bone-2)}
  .blicke button[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--synapse)}
  .blicke button:focus-visible{outline:2px solid var(--synapse);outline-offset:3px;border-radius:2px}

  .status{display:flex;flex-wrap:wrap;gap:2px 14px;font-family:var(--f-mono);font-size:10.5px;
    color:var(--mist);padding-bottom:10px}
  .status span{display:inline-flex;align-items:center;gap:6px}
  .status i{width:5px;height:5px;border-radius:50%;background:var(--c);flex:none}
  .status .ok{--c:var(--ok)} .status .wait{--c:var(--line-2)}
  .status .alarm{--c:var(--alarm);color:var(--alarm)} .status .muted{--c:var(--faint)}

  /* ---------- Puls ---------- */
  #puls{flex:1;padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px))}
  #puls[hidden]{display:none!important}
  .spalten{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
  .sekt{display:flex;flex-direction:column;gap:10px}
  div.sekt{gap:0}
  .sekt > h2{margin:0;font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--mist);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sekt > h2 em{font-style:normal;color:var(--faint);letter-spacing:.03em;text-transform:none}
  .leer{margin:0;font-size:13.5px;color:var(--mist);padding:4px 0}

  /* Zeile: der Grundbaustein. Eine Liste ist eine Folge von Zeilen,
     getrennt durch eine Haarlinie — kein Stapel gerahmter Kästen. */
  .z{display:grid;grid-template-columns:6px 1fr auto;gap:2px 11px;align-items:start;
    padding:12px 1px;background:none;border:0;border-radius:0}
  .z + .z{border-top:1px solid var(--line)}
  .z.wichtig{box-shadow:inset 2px 0 0 var(--alarm);padding-left:11px}
  .z > i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--line-2));margin-top:7px}
  .z-t{font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
  .z-t button{all:unset;cursor:pointer;text-align:left}
  .z-t button:hover{color:var(--synapse)}
  .z-t button:focus-visible{outline:2px solid var(--synapse);outline-offset:2px;border-radius:2px}
  .z-r{font-family:var(--f-mono);font-size:10.5px;color:var(--mist);white-space:nowrap;padding-top:3px;
    font-variant-numeric:tabular-nums}
  .z-m{grid-column:2/4;font-family:var(--f-mono);font-size:10.5px;color:var(--mist);line-height:1.45;
    overflow-wrap:anywhere}
  .z-a{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .z.alarm{--c:var(--alarm)} .z.alarm .z-r{color:var(--alarm)}
  .z.soon{--c:var(--soon)} .z.soon .z-r{color:var(--soon)}
  .z.ruhig{--c:var(--line-2)}
  .z.satt{--c:var(--ok)}

  .btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    min-height:32px;padding:0 11px;border-radius:var(--r);border:1px solid var(--line-2);font-size:13px;
    line-height:1;transition:background .12s,border-color .12s}
  .btn:hover{background:var(--hover);border-color:var(--mist)}
  .btn.primary{background:var(--synapse);border-color:var(--synapse);color:var(--on-synapse);font-weight:500}
  .btn.primary:hover{background:var(--synapse-2);border-color:var(--synapse-2)}
  .btn.still{border-color:transparent;color:var(--mist);padding:0 7px}
  .btn.still:hover{color:var(--bone);background:var(--hover)}
  .btn[disabled]{opacity:.45;cursor:default}
  .btn.mini{min-height:27px;font-size:12.5px;padding:0 9px}

  .pill{display:inline-block;padding:1px 6px;border-radius:3px;font-family:var(--f-mono);font-size:10px;
    line-height:16px;background:var(--raise);white-space:nowrap;letter-spacing:.02em}
  .pill.ok{color:var(--ok)} .pill.open{color:var(--soon)} .pill.alarm{color:var(--alarm)}
  .pill.info{color:var(--synapse)} .pill.muted{color:var(--mist)}

  /* Drei für heute */
  .plan{display:flex;flex-direction:column}
  .slot{display:grid;grid-template-columns:16px 1fr auto;gap:11px;align-items:center;
    padding:12px 1px;background:none;border:0}
  .slot + .slot{border-top:1px solid var(--line)}
  .slot .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .slot .t{font-size:14.5px;line-height:1.35;overflow-wrap:anywhere}
  .slot.frei .t{color:var(--mist);font-size:13.5px}
  .slot.fertig .t{color:var(--mist);text-decoration:line-through}
  .waehler{display:flex;flex-direction:column;gap:4px}
  .waehler button{all:unset;cursor:pointer;width:100%;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:10px;
    align-items:center;padding:10px 11px;border-radius:var(--r);border:1px solid var(--line);font-size:13.5px}
  .waehler button:hover{border-color:var(--mist);background:var(--hover)}
  .waehler button small{font-family:var(--f-mono);font-size:10.5px;color:var(--mist)}

  /* Balken (Wiederholen, Speicher) */
  /* Der Balken steht als <span> in einer Textzeile — ohne display:block
     verschluckt der Inline-Fluss seine Höhe und er ist unsichtbar. */
  .bar{display:block;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar b{display:block;height:100%;background:var(--c,var(--synapse));border-radius:2px}

  /* ---------- Antwort des Eingabefelds ---------- */
  #antwort{max-width:640px;margin:14px auto 0;padding:15px 16px;border-radius:var(--r);
    background:var(--shell);border:1px solid var(--line);position:relative;
    display:flex;flex-direction:column;gap:13px;box-shadow:var(--schatten)}
  #antwort[hidden]{display:none!important}
  #antwort p{margin:0;padding-right:26px;color:var(--bone);text-wrap:pretty}
  #antwort p.lead{color:var(--bone-2);font-size:13.5px}
  .denkt{display:flex;align-items:center;gap:9px;color:var(--mist);font-family:var(--f-mono);font-size:12px}
  .spark{width:6px;height:6px;border-radius:50%;background:var(--mist);
    animation:spark 1.2s ease-in-out infinite}
  @keyframes spark{50%{opacity:.2}}
  .refs{display:flex;flex-wrap:wrap;gap:6px}
  .ref{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;
    border-radius:var(--r);border:1px solid var(--line-2);font-size:12.5px}
  .ref:hover{border-color:var(--c,var(--synapse))}
  .ref i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--synapse))}
  .x{all:unset;position:absolute;top:9px;right:9px;width:26px;height:26px;display:grid;place-items:center;
    border-radius:3px;cursor:pointer;color:var(--mist);font-size:17px;line-height:1}
  .x:hover{background:var(--hover);color:var(--bone)}
  .felder{display:grid;grid-template-columns:1fr;gap:9px}
  .feld{display:flex;flex-direction:column;gap:4px}
  .feld label{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
  .feld input,.feld select{background:var(--shell);border:1px solid var(--line-2);border-radius:var(--r);
    color:var(--bone);font:inherit;font-size:13.5px;padding:8px 10px;min-width:0}
  .feld input:focus,.feld select:focus{outline:2px solid var(--synapse);outline-offset:-1px;border-color:var(--synapse)}
  .feld textarea{background:var(--shell);border:1px solid var(--line-2);border-radius:var(--r);
    color:var(--bone);font:inherit;font-size:13.5px;padding:8px 10px;min-width:0;resize:vertical}
  .feld textarea:focus{outline:2px solid var(--synapse);outline-offset:-1px;border-color:var(--synapse)}
  .feld-reihe{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .vorschlaege{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .vorschlaege li + li{border-top:1px solid var(--line)}
  .vorschlaege label{display:grid;grid-template-columns:18px auto 1fr;align-items:baseline;gap:2px 10px;
    padding:9px 6px;margin:0 -6px;border-radius:3px;cursor:pointer}
  .vorschlaege label:hover{background:var(--hover)}
  .vorschlaege input{margin:0;accent-color:var(--synapse);align-self:center}
  .v-art{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
  .v-art.termin{--c:var(--bone-2)} .v-art.aufgabe{--c:var(--synapse)}
  .v-m{grid-column:3;font-family:var(--f-mono);font-size:10.5px;color:var(--mist)}
  .v-h{display:block;margin:0 0 6px 28px;font-style:normal;font-size:11.5px;color:var(--soon)}
  .ergebnis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
  .ergebnis li{display:grid;grid-template-columns:16px 1fr;gap:8px}
  .ergebnis .ja{color:var(--ok)} .ergebnis .nein{color:var(--alarm)}

  /* ---------- Erinnerungstafel ---------- */
  #tafel{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;
    background:var(--scrim)}
  #tafel[hidden]{display:none!important}
  .tafel-karte{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;
    background:var(--shell);border:1px solid var(--line);border-radius:6px;
    padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:18px;
    box-shadow:0 12px 40px rgba(26,27,29,.20);animation:auf .2s ease-out}
  @keyframes auf{from{opacity:0;transform:translateY(8px)}}
  .tafel-kopf h2{font-weight:600;font-size:17px;line-height:1.35;margin:0;letter-spacing:-.01em}
  .tafel-kopf p{margin:6px 0 0;font-size:13.5px;color:var(--mist)}
  .karten{display:flex;flex-direction:column}
  .karte{display:flex;flex-direction:column;gap:9px;padding:14px 0;background:none;border:0}
  .karte + .karte{border-top:1px solid var(--line)}
  .karte.alarm{box-shadow:inset 2px 0 0 var(--alarm);padding-left:11px}
  .karte h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.4}
  .karte .wann{font-family:var(--f-mono);font-size:10.5px;color:var(--mist)}
  .karte.alarm .wann{color:var(--alarm)}
  .karte .aus{display:flex;flex-wrap:wrap;gap:6px}
  .tafel-fuss{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding-top:14px;border-top:1px solid var(--line)}
  .tafel-fuss .weg{margin-left:auto}
  .spaeter{display:flex;flex-wrap:wrap;gap:6px;padding:11px;border-radius:var(--r);
    background:var(--raise)}
  .spaeter-kopf{width:100%;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--mist)}

  /* ---------- Detailblatt ---------- */
  #blatt{position:fixed;left:0;right:0;bottom:0;z-index:14;max-height:56vh;
    background:var(--glass);border-top:1px solid var(--line-2);border-radius:8px 8px 0 0;
    display:flex;flex-direction:column;box-shadow:0 -6px 28px rgba(26,27,29,.14);
    animation:hoch .18s ease-out;transition:transform .22s ease-out}
  #blatt[hidden]{display:none!important}
  body[data-blick="gehirn"] #blatt{max-height:48vh}
  @keyframes hoch{from{transform:translateY(18px);opacity:0}}
  #blattBody{overflow:auto;overscroll-behavior:contain;padding:2px 18px calc(22px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;gap:16px;max-width:640px;margin:0 auto;width:100%}
  #blattBody h3{font-weight:600;font-size:16px;line-height:1.35;margin:0;letter-spacing:-.01em}
  #blattBody p{margin:0;color:var(--bone-2);font-size:13.5px;text-wrap:pretty;overflow-wrap:anywhere}
  #blattBody h4{margin:0 0 4px;font-family:var(--f-mono);font-weight:400;font-size:10.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
  .organ-marke{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10.5px;
    color:var(--mist);padding-right:30px}
  .organ-marke i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .fakten{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:13.5px}
  .fakten dt{font-family:var(--f-mono);font-size:11px;color:var(--mist);padding-top:2px}
  .fakten dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .block{display:flex;flex-direction:column}
  .karte-v{display:flex;flex-direction:column;gap:7px;padding:14px 0;border-top:1px solid var(--line)}
  .karte-v:first-of-type{border-top:0}
  .karte-v h5{margin:0;font-size:13.5px;font-weight:600;line-height:1.4}
  .karte-v p{font-size:13px}
  .karte-v p b{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--mist);margin-right:6px}
  .karte-v .meta{display:flex;flex-wrap:wrap;gap:5px}
  .karte-v.erledigt{opacity:.5}

  /* ---------- Organ-Navigation (liegt auf der Bühne) ---------- */
  #organe{position:fixed;left:0;right:0;bottom:0;z-index:13;max-height:52vh;
    display:flex;flex-direction:column;background:var(--slate);
    border-top:1px solid var(--slate-line-2);border-radius:8px 8px 0 0;

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ruhig = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const schmal = () => innerWidth < 980;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------------------------------------------------------------- Konfiguration
  const TZ = "Europe/Berlin";
  const PROJEKT = /studium/i;                              // Todoist-Projekt
  const SEKTIONEN_AUS = ["Routinen 🔁", "Inspiration ✨"];  // Todoist-Onboarding, explizit statt Regex
  const TAFEL_ZEITEN = ["08:30", "20:00"];                 // je einmal am Tag, wenn die Seite offen ist
  const TAFEL_PAUSE_MIN = 30;                              // frühestens so viel später wieder beim Öffnen
  const TAFEL_MAX = 3;                                     // niemals mehr Karten
  const PLAN_MAX = 3;                                      // „Drei für heute“
  const INTERVALLE = [1, 3, 7, 16, 35];                    // Wiederholungs-Queue, in Tagen
  const TAG_VON = 8, TAG_BIS = 22;                         // Fenster für „Einplanen“
  const KOMMT_TAGE = 14;                                   // „Kommt“ im Puls
  const HORIZONT = 42;                                     // was Kalender und Termine laden: sechs Wochen
  const LABELS_ERLAUBT = ["abgabe", "lernen", "orga", "wartet-auf"];

  // Vorlesungen aus dem Kalender. Links der Titel, wie er im Kalender steht, rechts die
  // Todoist-Sektion. fach: null heißt: als Vorlesung erkannt, Fach noch nicht zugeordnet.
  const VORLESUNGEN = [
    { titel: "Mathematische Grundlagen der Informatik", fach: "Mathematik (FOM)", kurz: "Mathe" },
    { titel: "Management Grundlagen", fach: "Management Basics", kurz: "Management" },
    { titel: "Zeit- und Selbstmanagement", fach: "ZSM", kurz: "ZSM" },
    { titel: "Konzepte der Programmierung", fach: null, kurz: "Konzepte der Programmierung" },
    { titel: "Wirtschaftsinformatik Basics", fach: null, kurz: "Wirtschaftsinformatik" },
  ];
  const alsVorlesung = (titel) => VORLESUNGEN.find((v) => v.titel === titel) || null;

  // ---------------------------------------------------------------- Zeit
  const berlin = (d = new Date()) => {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit",
      day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d).map((x) => [x.type, x.value]));
    return { date: `${p.year}-${p.month}-${p.day}`, time: `${p.hour}:${p.minute}` };
  };
  const tagNr = (iso) => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 864e5;
  const heute = () => berlin().date;
  const tageBis = (iso) => tagNr(iso) - tagNr(heute());
  const isoTag = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
  const kurzDatum = (iso) => new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" })
    .format(new Date(tagNr(iso) * 864e5));
  const langDatum = (iso) => new Intl.DateTimeFormat("de-DE", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" })
    .format(new Date(tagNr(iso) * 864e5));
  const stempel = (iso) => new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit",
    minute: "2-digit", timeZone: TZ }).format(new Date(iso));
  const rel = (d) => d < -1 ? `seit ${-d} Tagen überfällig` : d === -1 ? "seit gestern überfällig"
    : d === 0 ? "heute" : d === 1 ? "morgen" : d < 14 ? `in ${d} Tagen` : `in ${Math.round(d / 7)} Wochen`;
  const vorTagen = (iso) => { const d = -tageBis(berlin(new Date(iso)).date); return d <= 0 ? "heute" : d === 1 ? "gestern" : `vor ${d} Tagen`; };
  // Zeitzonen-Offset für ein konkretes Datum — Sommer-/Winterzeit inbegriffen.
  const offsetFuer = (datum) => {
    const probe = new Date(Date.UTC(+datum.slice(0, 4), +datum.slice(5, 7) - 1, +datum.slice(8, 10), 12));
    const b = berlin(probe);
    const min = Math.round((Date.UTC(+b.date.slice(0, 4), +b.date.slice(5, 7) - 1, +b.date.slice(8, 10),
      +b.time.slice(0, 2), +b.time.slice(3, 5)) - probe.getTime()) / 6e4);
    const a = Math.abs(min);
    return `${min >= 0 ? "+" : "-"}${String(Math.floor(a / 60)).padStart(2, "0")}:${String(a % 60).padStart(2, "0")}`;
  };
  const minuten = (hhmm) => +hhmm.slice(0, 2) * 60 + +hhmm.slice(3, 5);
  const alsUhr = (min) => `${String(Math.floor(min / 60) % 24).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
  const naechsterWochentag = (ziel) => {           // 6 = Samstag, 1 = Montag
    const d = new Date(tagNr(heute()) * 864e5);
    let n = tagNr(heute());
    for (let i = 1; i <= 7; i++) if (new Date((n + i) * 864e5).getUTCDay() === ziel) return isoTag(n + i);
    return isoTag(n + 1);
  };
  const istWochenende = (iso) => [0, 6].includes(new Date(tagNr(iso) * 864e5).getUTCDay());

  const kurz = (s, n) => (String(s).length > n ? String(s).slice(0, n - 1).trimEnd() + "…" : String(s));
  const schlicht = (s) => String(s ?? "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/[*_`]/g, "");
  const ohnePrefix = (s) => s.replace(/^[^:]{2,20}:\s*/, "");
  const zahl = (n) => new Intl.NumberFormat("de-DE").format(n || 0);
  const streu = (s) => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.codePointAt(0), 16777619); return (h >>> 0) / 4294967296; };

  $("#heute").textContent = new Intl.DateTimeFormat("de-DE", { weekday: "long", day: "numeric", month: "long", timeZone: TZ }).format(new Date());

  // ---------------------------------------------------------------- Zustand
  const S = {
    mcp: null, db: null, sample: null, caps: false,
    projektMeta: null, projekt: null, events: null,
    zustand: null, bericht: null, themen: [], klausuren: [], vorschlaege: [], agenten: {}, journal: [],
    plan: null, tafelStand: null,
    err: { todoist: null, kalender: null, db: null },
  };
  let blick = "puls";

  // ---------------------------------------------------------------- Ableitungen
  function aufgaben() {
    if (!S.projekt) return [];
    const alle = S.projekt.tasks || [];
    const sek = new Map((S.projekt.sections || []).map((s) => [s.id, s]));
    return alle.filter((t) => !t.checked && !t.isUncompletable).map((t) => {
      const s = t.sectionId ? sek.get(t.sectionId) || null : null;
      const roh = t.dueDate ? String(t.dueDate) : "";
      const datum = roh ? roh.slice(0, 10) : null;
      return {
        art: "aufgabe", id: t.id, titel: schlicht(t.content), sektion: s,
        roh, datum, uhrzeit: roh.length > 10 ? roh.slice(11, 16) : null,
        tage: datum ? tageBis(datum) : null, labels: t.labels || [], prio: t.priority || "p4",
        wiederkehrend: t.recurring || false, beschreibung: schlicht(t.description || ""),
        unter: (t.children || []).filter((k) => !k.checked).length,
      };
    }).filter((t) => !(t.sektion && SEKTIONEN_AUS.includes(t.sektion.name)));
  }
  const sektionen = () => (S.projekt?.sections || []).filter((s) => !SEKTIONEN_AUS.includes(s.name))
    .sort((a, b) => (a.sectionOrder || 0) - (b.sectionOrder || 0));

  // Ganztägige Termine kommen mit exklusivem Ende und können mehrere Tage umspannen —
  // sie erscheinen an jedem Tag, den sie belegen, nicht nur am ersten.
  function termine() {
    const von = tagNr(heute()), bis = von + HORIZONT;
    const raus = [];
    for (const e of S.events || []) {
      if (e.status === "cancelled") continue;
      const ganz = !!e.start?.date && !e.start?.dateTime;
      const titel = e.summary || "(ohne Titel)";
      const text = schlicht(e.description || "");
      if (ganz) {
        const a = tagNr(String(e.start.date).slice(0, 10));
        const b = Math.max(a + 1, tagNr(String(e.end?.date || e.start.date).slice(0, 10)));
        const dauer = b - a;
        for (let d = Math.max(a, von); d < Math.min(b, bis + 1); d++) {
          raus.push({ art: "termin", id: e.id + (dauer > 1 ? ":" + d : ""), evId: e.id, titel, text,
            datum: isoTag(d), uhrzeit: null, endUhr: null, ganz: true, tage: d - von,
            teil: dauer > 1 ? `Tag ${d - a + 1} von ${dauer}` : null, verschiebbar: false });
        }
      } else {
        const start = berlin(new Date(e.start.dateTime));
        const d = tagNr(start.date);
        if (d < von || d > bis) continue;
        const vl = alsVorlesung(titel);
        raus.push({ art: "termin", id: e.id, evId: e.id, titel, text, datum: start.date, uhrzeit: start.time,
          endUhr: e.end?.dateTime ? berlin(new Date(e.end.dateTime)).time : null, ganz: false,
          tage: d - von, teil: null, vorlesung: vl, fach: vl?.fach || null,
          verschiebbar: !vl, rohStart: e.start.dateTime });
      }
    }
    return raus.sort((a, b) => (a.datum + (a.uhrzeit || "")).localeCompare(b.datum + (b.uhrzeit || "")));
  }

  // Wiederholungs-Queue: echte Intervalle. Alte Themen ohne Stufe werden hier hergeleitet.
  function themen() {
    return S.themen.map((t) => {
      const stufe = Number.isInteger(t.stufe) ? clamp(t.stufe, 0, INTERVALLE.length - 1)
        : clamp(t.wiederholungen || 0, 0, INTERVALLE.length - 1);
      const faellig = t.faellig || (t.zuletzt
        ? isoTag(tagNr(berlin(new Date(t.zuletzt)).date) + INTERVALLE[stufe])
        : heute());
      return { ...t, stufe, faellig, tage: tageBis(faellig) };
    });
  }
  const themenAktiv = () => {
    const h = heute(), bald = isoTag(tagNr(h) + 7);
    return themen().filter((t) => (!t.modulStart || t.modulStart <= bald) && (!t.modulEnde || t.modulEnde >= h));
  };
  const themenFaellig = () => themenAktiv().filter((t) => t.tage <= 0).sort((a, b) => a.tage - b.tage);

  const dringlich = (x) => x.tage == null ? ["ruhig", 0.72] : x.tage < 0 ? ["alarm", 1.35]
    : x.tage === 0 ? ["soon", 1.3] : x.tage <= 3 ? ["soon", 1.2] : x.tage <= 14 ? ["ruhig", 1.02] : ["ruhig", 0.8];

  const laeufe = () => [...(S.zustand?.laeufe || [])].sort((a, b) => b.zeit.localeCompare(a.zeit));
  const rechnerAlterTage = () => (S.zustand?.stand ? -tageBis(berlin(new Date(S.zustand.stand)).date) : null);
  const planIds = () => (S.plan && S.plan.datum === heute() ? S.plan.ids || [] : []);
  const stummBis = () => S.tafelStand?.stumm_bis || null;
  const istStumm = () => { const b = stummBis(); return !!b && Date.parse(b) > Date.now(); };
  const gesehenHeute = () => (S.tafelStand?.gesehen || {})[heute()] || [];

  // ---------------------------------------------------------------- Fehlertexte
  const AUTHZ = new Set(["needs_reauth", "server_not_connected", "server_not_found", "selection_required",
    "blocked_by_policy", "approval_required", "not_in_manifest", "not_granted", "capability_disabled",
    "capability_removed", "no_project", "consent_required", "user_changed"]);

  function mcpText(e, name, schreiben) {
    switch (e?.code) {
      case "no_project": return "Kein Todoist-Projekt „Studium“ gefunden";
      case "needs_reauth": return `${name} neu verbinden: claude.ai → Einstellungen → Connectors`;
      case "server_not_connected": case "server_not_found":
        return `${name} in claude.ai unter Einstellungen → Connectors verbinden`;
      case "selection_required": return `In claude.ai auswählen, welches ${name}-Konto gilt`;
      case "not_in_manifest": return `${name} ist für diese Seite nicht freigegeben`;
      case "consent_required": return `${name} für diese Seite erlauben, dann nochmal versuchen`;
      case "blocked_by_policy": case "approval_required": return `${name} ist durch eine Richtlinie gesperrt`;
      case "not_granted": case "capability_disabled": case "capability_removed":
        return "Live-Daten sind in dieser Ansicht nicht verfügbar";
      case "rate_limited": return `Zu viele Anfragen an ${name}. Warte einen Moment.`;
      case "server_unavailable": return `${name} antwortet gerade nicht. Gleich nochmal versuchen.`;
      case "tool_error": return `${name}: ${e.message}`;
      case "cancelled": return schreiben
        ? `Abgebrochen — prüf in ${name}, ob es doch durchgelaufen ist.` : "Abgebrochen";
      default: return schreiben
        ? `${name} hat nicht sicher geantwortet. Prüf in ${name}, ob es angekommen ist, bevor Du es nochmal versuchst.`
        : `${name} antwortet gerade nicht`;
    }
  }
  const dbText = (e) => e?.code === "quota_exceeded" ? "Der Speicher des Gehirns ist voll."
    : e?.code === "revoked" || e?.code === "not_granted" ? "Der Speicher ist in dieser Ansicht nicht verfügbar."
    : "Speichern hat nicht geklappt. Versuch es nochmal.";
  function sampleText(e) {
    switch (e?.code) {
      case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled":
      case "capability_removed": return "Claude ist für diese Seite nicht freigegeben. Eintragen per Kurzschrift geht weiter.";
      case "rate_limited": return "Gerade zu viele Anfragen. Warte einen Moment.";
      case "session_expired": return "Bitte bei claude.ai neu anmelden und die Seite neu laden.";
      case "refused": return "Darauf antwortet Claude nicht. Formulier es bitte anders.";
      case "prompt_too_large": return "Das war zu viel auf einmal. Teil es in kürzere Nachrichten auf.";
      case "invalid_json": case "empty_completion": return "Die Antwort kam unvollständig an. Schick es nochmal, gern kürzer.";

  // ---------------------------------------------------------------- Toast mit Rückgängig
  const toastEl = $("#toast");
  let toastUhr = null, zurueck = null;
  function toast(text, undo) {
    zurueck = undo || null;
    toastEl.innerHTML = `<span>${esc(text)}</span>` + (undo ? `<button type="button" class="btn mini" data-undo>Rückgängig</button>` : "");
    toastEl.hidden = false;
    clearTimeout(toastUhr);
    toastUhr = setTimeout(() => { toastEl.hidden = true; zurueck = null; }, undo ? 6000 : 4200);
  }
  toastEl.addEventListener("click", async (ev) => {
    if (!ev.target.closest("[data-undo]") || !zurueck) return;
    const fn = zurueck; zurueck = null;
    toastEl.innerHTML = "<span>Wird zurückgenommen …</span>";
    try { await fn(); toast("Zurückgenommen."); }
    catch (e) { toast(e?.__text || "Zurücknehmen hat nicht geklappt."); }
  });

  // ---------------------------------------------------------------- Schreibschicht
  async function tdo(tool, input) {
    if (!S.mcp) throw { code: "not_granted" };
    return (await S.mcp.callTool("Todoist", tool, input)).payload;
  }
  async function gcal(tool, input) {
    if (!S.mcp) throw { code: "not_granted" };
    return (await S.mcp.callTool("Google Calendar", tool, input)).payload;
  }
  const frischT = () => S.mcp?.invalidate("Todoist", "get-overview").catch(() => {});
  const frischK = () => S.mcp?.invalidate("Google Calendar", "list_events").catch(() => {});
  const weiter = (e, name, schreiben) => { const t = mcpText(e, name, schreiben); return Object.assign(new Error(t), { __text: t }); };

  async function erledigen(t) {
    try {
      await tdo("complete-tasks", { ids: [t.id] });
      frischT(); funke("todoist");
      if (t.wiederkehrend) {
        // Todoist schließt so eine Aufgabe nicht, sondern stellt sie weiter. Zurückgenommen
        // wird deshalb über das Datum, nicht über uncomplete-tasks.
        toast(`${kurz(t.titel, 30)}: abgehakt, der nächste Termin steht schon.`, t.roh ? async () => {
          try { await tdo("reschedule-tasks", { tasks: [{ id: t.id, date: t.roh }] }); frischT(); }
          catch (e) { throw weiter(e, "Todoist", true); }
        } : null);
      } else {
        toast(`${kurz(t.titel, 38)}: erledigt.`, async () => {
          try { await tdo("uncomplete-tasks", { ids: [t.id] }); frischT(); }
          catch (e) { throw weiter(e, "Todoist", true); }
        });
      }
      return true;
    } catch (e) { toast(mcpText(e, "Todoist", true)); return false; }
  }

  // Wohin „Später“ verschiebt. Es bewegt die echte Frist — darum immer mit Rückgängig.
  function spaeterZiele(x) {
    const h = heute(), z = [];
    if (x.art === "termin") {
      if (!x.verschiebbar) return z;
      if (x.tage === 0 && minuten(x.uhrzeit) + 60 < 24 * 60)
        z.push({ label: "+1 Std", datum: h, uhrzeit: alsUhr(minuten(x.uhrzeit) + 60) });
      z.push({ label: "Morgen", datum: isoTag(tagNr(x.datum) + 1), uhrzeit: x.uhrzeit });
      if (!istWochenende(h)) z.push({ label: "Wochenende", datum: naechsterWochentag(6), uhrzeit: x.uhrzeit });
      z.push({ label: "Nächste Woche", datum: naechsterWochentag(1), uhrzeit: x.uhrzeit });
      return z;
    }
    if (x.uhrzeit && x.tage === 0 && minuten(x.uhrzeit) + 60 < 24 * 60)
      z.push({ label: "+1 Std", datum: h, uhrzeit: alsUhr(minuten(x.uhrzeit) + 60) });
    if ((x.tage ?? 0) <= 0 && minuten(berlin().time) < 18 * 60)
      z.push({ label: "Heute Abend", datum: h, uhrzeit: "18:00" });
    z.push({ label: "Morgen", datum: isoTag(tagNr(h) + 1), uhrzeit: null });
    if (!istWochenende(h)) z.push({ label: "Wochenende", datum: naechsterWochentag(6), uhrzeit: null });
    z.push({ label: "Nächste Woche", datum: naechsterWochentag(1), uhrzeit: null });
    return z;
  }
  const zielWort = (z) => `${tageBis(z.datum) === 0 ? "heute" : tageBis(z.datum) === 1 ? "morgen" : kurzDatum(z.datum)}${z.uhrzeit ? ", " + z.uhrzeit : ""}`;

  async function verschieben(x, ziel) {
    if (x.art === "termin") {
      // Gilt auch für den Weg über das Eingabefeld, der den Knopf umgeht.
      if (!x.verschiebbar) {
        toast(x.vorlesung ? "Vorlesungen verschiebt diese Seite nicht." : "Ganztägige Termine verschiebt diese Seite nicht.");
        return false;
      }
      const start = `${ziel.datum}T${ziel.uhrzeit}:00${offsetFuer(ziel.datum)}`;
      try {
        await gcal("update_event", { eventId: x.evId, startTime: start, timeZone: TZ });
        frischK(); funke("kalender");
        toast(`${kurz(x.titel, 28)}: jetzt ${zielWort(ziel)}.`, async () => {
          try { await gcal("update_event", { eventId: x.evId, startTime: x.rohStart, timeZone: TZ }); frischK(); }
          catch (e) { throw weiter(e, "Google Kalender", true); }
        });
        return true;
      } catch (e) { toast(mcpText(e, "Google Kalender", true)); return false; }
    }
    // Aufgabe. Wichtig: ein reines Datum löscht eine vorhandene Uhrzeit — entgegen der
    // Tool-Beschreibung, an einem echten Aufruf belegt. Darum wird sie mitgeschickt.
    const eff = { datum: ziel.datum, uhrzeit: ziel.uhrzeit || x.uhrzeit || null };
    const datum = eff.uhrzeit ? `${eff.datum}T${eff.uhrzeit}:00` : eff.datum;
    try {
      await tdo("reschedule-tasks", { tasks: [{ id: x.id, date: datum }] });
      frischT(); funke("todoist");
      const undo = x.roh ? async () => {
        try { await tdo("reschedule-tasks", { tasks: [{ id: x.id, date: x.roh }] }); frischT(); }
        catch (e) { throw weiter(e, "Todoist", true); }
      } : null;
      toast(`${kurz(x.titel, 28)}: jetzt ${zielWort(eff)}.${x.roh ? "" : " Vorher stand kein Datum drin."}`, undo);
      return true;
    } catch (e) { toast(mcpText(e, "Todoist", true)); return false; }
  }

  async function wiederholen(t, art) {
    if (!S.db) { toast("Der Speicher ist in dieser Ansicht nicht verfügbar."); return false; }
    const alt = { stufe: t.stufe, faellig: t.faellig, zuletzt: t.zuletzt ?? null, wiederholungen: t.wiederholungen || 0 };
    let neu, wort;
    if (art === "morgen") {
      neu = { ...alt, faellig: isoTag(tagNr(heute()) + 1) };
      wort = `${kurz(t.name, 28)}: morgen nochmal.`;
    } else {
      const stufe = clamp(t.stufe + (art === "sitzt" ? 2 : 1), 0, INTERVALLE.length - 1);
      neu = { stufe, faellig: isoTag(tagNr(heute()) + INTERVALLE[stufe]), zuletzt: new Date().toISOString(),
        wiederholungen: (t.wiederholungen || 0) + 1 };
      wort = `${kurz(t.name, 24)}: wieder dran in ${INTERVALLE[stufe]} Tagen.`;
    }
    try {
      await S.db.doc("themen/" + t.id).update(neu);
      funke("gedaechtnis");
      toast(wort, async () => {
        try { await S.db.doc("themen/" + t.id).update(alt); }

      });
      return true;
    } catch (e) { toast(dbText(e)); return false; }
  }

  // ---------------------------------------------------------------- Einplanen: freie Fenster
  function freieFenster(dauerMin, bisTag) {
    const belegt = termine().filter((e) => !e.ganz && e.uhrzeit);
    const raus = [];
    for (let d = 0; d <= bisTag && raus.length < 3; d++) {
      const datum = isoTag(tagNr(heute()) + d);
      const frueh = d === 0 ? Math.max(minuten(berlin().time) + 15, TAG_VON * 60) : TAG_VON * 60;
      let cursor = Math.ceil(frueh / 15) * 15;
      const tages = belegt.filter((e) => e.datum === datum)
        .map((e) => [minuten(e.uhrzeit), e.endUhr ? minuten(e.endUhr) : minuten(e.uhrzeit) + 60])
        .sort((a, b) => a[0] - b[0]);
      for (const [von, bis] of [...tages, [TAG_BIS * 60, TAG_BIS * 60]]) {
        if (cursor + dauerMin > TAG_BIS * 60) break;
        if (von - cursor >= dauerMin) { raus.push({ datum, uhrzeit: alsUhr(cursor) }); break; }
        cursor = Math.max(cursor, bis);
      }
    }
    return raus;
  }

  async function einplanen(t, slot, dauerMin) {
    const start = `${slot.datum}T${slot.uhrzeit}:00${offsetFuer(slot.datum)}`;
    const ende = `${slot.datum}T${alsUhr(minuten(slot.uhrzeit) + dauerMin)}:00${offsetFuer(slot.datum)}`;
    try {
      await gcal("create_event", { summary: t.titel, startTime: start, endTime: ende, timeZone: TZ,
        description: `Arbeitsblock für die Aufgabe: ${t.titel}` });
      frischK(); funke("kalender");
      toast(`Block am ${kurzDatum(slot.datum)} um ${slot.uhrzeit} angelegt.`);
      return true;
    } catch (e) { toast(mcpText(e, "Google Kalender", true)); return false; }
  }

  // ---------------------------------------------------------------- Tafel-Gedächtnis
  async function tafelMerken(feld) {
    if (!S.db) return;
    const h = heute(), alt = S.tafelStand || {};
    const gesehen = {};
    for (const [k, v] of Object.entries(alt.gesehen || {})) if (k >= h) gesehen[k] = v;   // alte Tage wegräumen
    const stand = { stumm_bis: alt.stumm_bis || null, letzteTafel: alt.letzteTafel || null,
      slots: { ...(alt.slots || {}) }, gesehen };
    if (feld.gesehenZusatz) {
      stand.gesehen[h] = [...new Set([...(gesehen[h] || []), ...feld.gesehenZusatz])];
      delete feld.gesehenZusatz;
    }
    Object.assign(stand, feld);
    try { await S.db.doc("cortex/tafel").set(stand); } catch (e) { /* die Tafel darf daran nicht scheitern */ }
  }

      text: "Gliederung nach Lebensbereichen: 01 Studium & Ausbildung, 02 Kanu & Verein, 05 Finanzen & Verwaltung, 99 Archiv. Statt löschen geht alles in die Quarantäne — datiert und zurückholbar." },
  ];
  const organById = Object.fromEntries(ORGANE.map((o) => [o.id, o]));
  // Beschreibungen aus der bisherigen Fassung — sie erklaeren, was jedes Skript tut.
  const SKRIPT_TEXT = {
    s01: "Erfasst den Dateibestand und schreibt ihn nach daten\\inventar.csv.",
    s02: "Sucht Duplikate im Inventar, auch über Laufwerke und die Cloud hinweg.",
    s03: "Plant und verschiebt Dateien in Quarantäne und Ablage, mit Trockenlauf vorab.",
    s04: "Entlastet OneDrive, damit der Cloud-Speicher nicht vollläuft.",
    s05: "Wartet, bis Uploads fertig sind, bevor etwas bewegt wird.",
    s06: "Liest Aufnahmedaten aus Fotos und Videos, damit sie nach echtem Datum abgelegt werden.",
    s07: "Schreibt den Rechner-Stand in den Speicher dieses Gehirns.",
    s08: "Prüft die Ablageregeln gegen den echten Downloads-Ordner.",
    s09: "Sortiert Downloads nach den Ablageregeln. Erst ein Trockenlauf, dann wird nur verschoben, was Du freigibst. Jede Bewegung wird protokolliert, mit Rückgängig-Skript.",
  };
  const REFLEXE = [
    ["Nichts wird gelöscht", "Quarantäne und Papierkorb statt endgültigem Löschen."],
    ["Zugangsdaten nur melden", "Dateien wie Recovery-Codes, Passwortlisten oder VPN-Profile werden gemeldet, nie bewegt."],
    ["Mails nur als Entwurf", "Senden an andere Menschen bleibt bei Dir."],
    ["Jede Bewegung protokolliert", "Jede Dateibewegung landet in logs\\ und lässt sich zurückverfolgen."],
    ["Laufende Downloads tabu", ".crdownload- und .part-Dateien werden nicht angefasst."],
    ["Kein Überschreiben", "Bei Namenskonflikten gibt es ein Suffix wie _2, kein Datenverlust."],
  ];
  const KANTEN = [
    ["gmail", "takt"], ["kalender", "takt"], ["downloads", "takt"], ["notion", "takt"], ["du", "takt"],
    ["takt", "todoist"], ["takt", "bericht"], ["takt", "ablage"], ["takt", "plan"], ["takt", "haende"],
    ["du", "plan"], ["du", "kalender"], ["plan", "todoist"], ["plan", "gedaechtnis"],
    ["haende", "ablage"], ["haende", "protokoll"], ["haende", "reflexe"],
    ["reflexe", "downloads"], ["reflexe", "ablage"], ["protokoll", "gedaechtnis"],
    ["agent-ordnung", "haende"], ["agent-ordnung", "ablage"], ["agent-cortex", "takt"],
    ["agent-cortex", "plan"], ["bericht", "notion"],
  ];
  const WARN_TEXT = {
    zugangsdaten: { titel: "Zugangsdaten offen in Downloads", rat: "In den Passwort-Manager übernehmen, dann die Datei aus Downloads entfernen.", organ: "reflexe" },
    abgebrochen: { titel: "Abgebrochener Download", rat: "Neu herunterladen oder entfernen. Das System fasst die Datei nicht an.", organ: "downloads" },
    speicher: { titel: "Speicher wird knapp", rat: "Quarantäne leeren oder große Videos auf ein anderes Laufwerk verschieben.", organ: "ablage" },
  };
  const warnungen = () => (S.zustand?.warnungen || []).map((w) => ({ ...w,
    titel: WARN_TEXT[w.art]?.titel || "Meldung vom Rechner", rat: WARN_TEXT[w.art]?.rat || "",
    organ: WARN_TEXT[w.art]?.organ || "downloads" }));

  function organZahl(o) {
    switch (o.id) {
      case "kalender": return S.events ? termine().length : null;
      case "downloads": return S.zustand?.downloads?.dateien ?? null;
      case "du": return S.journal.length || null;
      case "takt": return laeufe().filter((r) => r.zeit.slice(0, 10) === heute()).length || null;
      case "agent-ordnung": case "agent-cortex":
        return S.vorschlaege.filter((v) => v.agent === o.id.replace("agent-", "") && v.status === "neu").length || null;
      case "plan": return S.projekt ? aufgaben().length : null;
      case "gedaechtnis": return themenFaellig().length || null;
      case "protokoll": return laeufe().length || null;
      case "haende": return (S.zustand?.skripte || []).length || null;
      case "reflexe": return warnungen().length || null;
      case "todoist": return S.projekt ? aufgaben().filter((t) => t.tage != null && t.tage <= 0).length || null : null;
      case "bericht": return (S.bericht?.abschnitte || []).length || null;
      case "ablage": return (S.zustand?.regeln?.zugeordnet) ?? null;
      default: return null;
    }
  }
  const organWarn = (o) => warnungen().some((w) => w.organ === o.id);

  // ---------------------------------------------------------------- Bausteine
  const pill = (k, t) => `<span class="pill ${k}">${esc(t)}</span>`;
  const btn = (attrs, label, klasse = "") => `<button type="button" class="btn ${klasse}" ${attrs}>${esc(label)}</button>`;
  const fakten = (paare) => {
    const r = paare.filter((p) => p && p[1] !== "" && p[1] != null);
    return r.length ? `<dl class="fakten">${r.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>` : "";
  };
  const block = (titel, html) => (html ? `<div class="block"><h4>${esc(titel)}</h4>${html}</div>` : "");

  function aktionen(x) {
    const a = [];
    if (x.art === "aufgabe" && S.mcp) {
      a.push(btn(`data-do="erledigt" data-art="aufgabe" data-id="${esc(x.id)}"`, "Erledigt", "mini primary"));
      a.push(btn(`data-do="spaeter" data-art="aufgabe" data-id="${esc(x.id)}"`, "Später", "mini"));
      a.push(btn(`data-do="einplanen" data-art="aufgabe" data-id="${esc(x.id)}"`, "Einplanen", "mini"));
    }
    if (x.art === "termin" && S.mcp && x.verschiebbar)
      a.push(btn(`data-do="spaeter" data-art="termin" data-id="${esc(x.id)}"`, "Später", "mini"));
    if (x.art === "aufgabe" && S.db) {
      const drin = planIds().includes(x.id);
      a.push(btn(`data-do="plan" data-id="${esc(x.id)}"`, drin ? "Aus dem Tagesplan" : "Heute", "mini still"));
    }
    return a.length ? `<div class="z-a">${a.join("")}</div>` : "";
  }

  function zeile(x, opt = {}) {
    const [ton] = dringlich(x);
    const rechts = x.art === "termin"
      ? (x.uhrzeit ? x.uhrzeit : "ganztägig")
      : (x.tage == null ? "ohne Datum" : rel(x.tage));
    const meta = [
      x.art === "termin" ? (opt.ohneDatum ? "" : x.tage === 0 ? "heute" : kurzDatum(x.datum)) : (x.sektion?.name || "ohne Fach"),
      x.vorlesung ? (x.endUhr ? `Vorlesung bis ${x.endUhr}` : "Vorlesung") : "",
      x.vorlesung ? (x.fach || "Fach nicht zugeordnet") : "",
      x.teil || "",
      x.art === "aufgabe" && x.wiederkehrend ? "wiederkehrend" : "",
      x.art === "aufgabe" && x.unter ? `${x.unter} Unteraufgaben` : "",
      x.labels?.includes("abgabe") ? "Abgabe" : "",
    ].filter(Boolean).join(" · ");
    return `<div class="z ${ton}${x.labels?.includes("abgabe") ? " wichtig" : ""}">
      <i></i>
      <div class="z-t"><button type="button" data-do="blatt" data-art="${x.art}" data-id="${esc(x.id)}">${esc(kurz(x.titel, 90))}</button></div>
      <div class="z-r">${esc(rechts)}</div>
      ${meta ? `<div class="z-m">${esc(meta)}</div>` : ""}
      ${opt.ohneAktionen ? "" : aktionen(x)}
    </div>`;
  }

  function themaZeile(t) {
    const anteil = t.tage <= 0 ? 0 : clamp(t.tage / INTERVALLE[t.stufe], 0, 1);
    const wann = t.tage < 0 ? `seit ${-t.tage} ${-t.tage === 1 ? "Tag" : "Tagen"} fällig`
      : t.tage === 0 ? "heute fällig" : `in ${t.tage} ${t.tage === 1 ? "Tag" : "Tagen"}`;
    return `<div class="z ${t.tage <= 0 ? "soon" : "satt"}">
      <i></i>
      <div class="z-t">${esc(t.name)}</div>
      <div class="z-r">${esc(wann)}</div>
      <div class="z-m">${esc(t.modul || "")} · Stufe ${t.stufe + 1} von ${INTERVALLE.length}${t.zuletzt ? " · zuletzt " + esc(vorTagen(t.zuletzt)) : " · noch nie"}
        <span class="bar" style="--c:${t.tage <= 0 ? "var(--soon)" : "var(--ok)"}"><b style="width:${Math.round((1 - anteil) * 100)}%"></b></span></div>
      ${S.db ? `<div class="z-a">
        ${btn(`data-do="wiederholt" data-id="${esc(t.id)}"`, "Wiederholt", "mini primary")}
        ${btn(`data-do="morgen" data-id="${esc(t.id)}"`, "Morgen nochmal", "mini")}
        ${btn(`data-do="sitzt" data-id="${esc(t.id)}"`, "Sitzt", "mini still")}
      </div>` : ""}
    </div>`;
  }

  // ---------------------------------------------------------------- Puls
  const sekt = (titel, zusatz, inhalt, weit) =>
    `<section class="sekt${weit ? " weit" : ""}"><h2>${esc(titel)}${zusatz ? `<em>${esc(zusatz)}</em>` : ""}</h2>${inhalt}</section>`;
  const leer = (t) => `<p class="leer">${esc(t)}</p>`;

  function planSektion() {
    if (!S.db) return sekt("Drei für heute", "", leer("Der Speicher ist in dieser Ansicht nicht verfügbar — der Tagesplan braucht ihn."), true);
    const ids = planIds(), A = aufgaben();
    const reihen = [];
    for (let i = 0; i < PLAN_MAX; i++) {
      const id = ids[i];
      if (!id) {
        reihen.push(`<div class="slot frei"><span class="n">${i + 1}</span><span class="t">noch frei</span>
          ${btn(`data-do="planwahl"`, "Wählen", "mini still")}</div>`);
        continue;
      }
      const t = A.find((x) => x.id === id);
      if (!t) {
        reihen.push(`<div class="slot fertig"><span class="n">${i + 1}</span><span class="t">erledigt oder verschoben</span>
          ${btn(`data-do="planweg" data-id="${esc(id)}"`, "Platz frei", "mini still")}</div>`);
        continue;
      }
      reihen.push(`<div class="slot"><span class="n">${i + 1}</span>
        <span class="t"><button type="button" class="z-t" data-do="blatt" data-art="aufgabe" data-id="${esc(t.id)}" style="all:unset;cursor:pointer">${esc(kurz(t.titel, 60))}</button></span>
        ${S.mcp ? btn(`data-do="erledigt" data-art="aufgabe" data-id="${esc(t.id)}"`, "Erledigt", "mini primary") : ""}</div>`);
    }
    const zusatz = ids.length ? `${ids.filter((id) => !A.find((x) => x.id === id)).length} von ${ids.length} erledigt` : "";
    const ohneZeit = ids.map((id) => A.find((x) => x.id === id)).filter((t) => t && !t.uhrzeit).length;
    const hinweis = ohneZeit
      ? `<p class="leer">Aufs Handy erinnert Todoist nur Aufgaben mit Uhrzeit — eigene Erinnerungszeiten braucht Premium. Für die übrigen ist der Morgen-Brief der Weg.</p>`
      : "";
    return sekt("Drei für heute", zusatz, `<div class="plan">${reihen.join("")}</div>${hinweis}`, true);
  }

  function jetztSektion() {
    const A = aufgaben(), T = termine(), jetztMin = minuten(berlin().time);
    const ueberfaellig = A.filter((t) => t.tage != null && t.tage < 0).sort((a, b) => a.tage - b.tage);
    const heuteAuf = A.filter((t) => t.tage === 0);
    const heuteTerm = T.filter((e) => e.tage === 0 && (!e.uhrzeit || minuten(e.uhrzeit) >= jetztMin - 60));
    const w = warnungen();
    const teile = [];
    if (ueberfaellig.length) teile.push(ueberfaellig.map((t) => zeile(t)).join(""));
    if (heuteAuf.length) teile.push(heuteAuf.map((t) => zeile(t)).join(""));
    if (heuteTerm.length) teile.push(heuteTerm.map((e) => zeile(e)).join(""));
    if (w.length) teile.push(w.map((x) => warnZeile(x)).join(""));
    if (!teile.length) {
      const grund = !S.projekt && !S.events ? "Noch keine Live-Daten." : "Heute ist nichts fällig und nichts überfällig.";
      return sekt("Jetzt", "", leer(grund));
    }
    return sekt("Jetzt", `${ueberfaellig.length ? ueberfaellig.length + " überfällig" : "nichts überfällig"}`,
      `<div class="sekt">${teile.join("")}</div>`);
  }

  function warnZeile(w) {
    return `<div class="z alarm">
      <i></i>
      <div class="z-t">${esc(w.titel)}</div>
      <div class="z-r">${esc(w.seit ? vorTagen(w.seit) : "")}</div>
      <div class="z-m">${esc(w.detail || "")}${w.rat ? " · " + esc(w.rat) : ""}</div>
      ${S.db ? `<div class="z-a">${btn(`data-do="passt" data-art="warnung" data-id="${esc(w.id)}"`, "Passt", "mini")}</div>` : ""}
    </div>`;
  }

  function kommtSektion() {
    const A = aufgaben().filter((t) => t.tage != null && t.tage > 0 && t.tage <= KOMMT_TAGE);
    const T = termine().filter((e) => e.tage > 0);
    const alles = [...A, ...T].sort((a, b) => (a.datum + (a.uhrzeit || "")).localeCompare(b.datum + (b.uhrzeit || ""))).slice(0, 5);
    const spaeter = aufgaben().filter((t) => t.tage != null && t.tage > KOMMT_TAGE).length;
    if (!alles.length) return sekt("Kommt", "", leer("In den nächsten zwei Wochen steht nichts."));
    return sekt("Kommt", `nächste ${KOMMT_TAGE} Tage${spaeter ? ` · ${spaeter} später` : ""}`,
      `<div class="sekt">${alles.map((x) => zeile(x, { ohneAktionen: x.art === "termin" })).join("")}</div>
       ${btn(`data-do="blick" data-blick="kalender"`, "Im Kalender ansehen", "mini still")}`);
  }

  function rechnerSektion() {
    if (!S.db) return sekt("Was der Rechner tat", "", leer("Der Rechner-Stand kommt aus dem Speicher, der hier nicht verfügbar ist."));
    if (!S.zustand) return sekt("Was der Rechner tat", "", leer(S.err.db ? dbText(S.err.db) : "Noch kein Rechner-Stand eingetroffen."));
    const alter = rechnerAlterTage();
    const L = laeufe(), letzte = L[0];
    const heuteL = L.filter((r) => r.zeit.slice(0, 10) === heute());
    const d = S.zustand.downloads || {};
    const eng = (S.zustand.speicher || []).filter((s) => s.freiGB / s.gesamtGB < 0.12);
    const zeilen = [];
    if (letzte) zeilen.push(`<div class="z ruhig"><i></i>
      <div class="z-t">${esc(letzte.gruppe)}${letzte.typ === "plan" ? " · Trockenlauf" : ""}</div>
      <div class="z-r">${esc(stempel(letzte.zeit))}</div>
      <div class="z-m">${esc(zahl(letzte.zeilen))} Zeilen protokolliert${heuteL.length ? ` · ${heuteL.length} Läufe heute` : ""} · Zurückholen über logs\\</div></div>`);
    if (d.dateien) zeilen.push(`<div class="z ruhig"><i></i>
      <div class="z-t">Downloads</div><div class="z-r">${esc(zahl(d.dateien))}</div>
      <div class="z-m">${esc(zahl(d.mb))} MB · ${esc(zahl(d.neu7Tage))} neu in 7 Tagen</div></div>`);
    for (const s of eng) zeilen.push(`<div class="z soon"><i></i>
      <div class="z-t">Laufwerk ${esc(s.laufwerk)} wird knapp</div>
      <div class="z-r">${esc(s.freiGB)} GB frei</div>
      <div class="z-m">von ${esc(zahl(s.gesamtGB))} GB
        <span class="bar" style="--c:var(--soon)"><b style="width:${Math.round((1 - s.freiGB / s.gesamtGB) * 100)}%"></b></span></div></div>`);
    const zusatz = alter == null ? "" : alter <= 0 ? "Stand von heute" : alter === 1 ? "Stand von gestern" : `Stand ${alter} Tage alt`;
    return sekt("Was der Rechner tat", zusatz, `<div class="sekt">${zeilen.join("") || leer("Keine Läufe verzeichnet.")}</div>`);
  }

  function wiederholenSektion() {
    if (!S.db) return "";
    const aktiv = themenAktiv().sort((a, b) => a.tage - b.tage);
    const neuKnopf = `<div class="z-a" style="margin:6px 0 0">${btn(`data-do="themaNeu"`, "Thema anlegen", "mini")}</div>`;
    if (!aktiv.length) return sekt("Wiederholen", "",
      leer(S.themen.length ? "Für die laufenden Module steht nichts an." : "Noch nichts im Gedächtnis. Leg das erste Thema an.") + neuKnopf);
    const faellig = aktiv.filter((t) => t.tage <= 0);
    const zeig = faellig.length ? faellig.slice(0, 6) : aktiv.slice(0, 3);
    return sekt("Wiederholen", faellig.length ? `${faellig.length} fällig` : "nichts fällig",
      `<div class="sekt">${zeig.map(themaZeile).join("")}</div>${neuKnopf}`);
  }

  const ohneLive = () => S.caps && !S.mcp && !S.db;
  function renderPuls() {
    if (blick !== "puls") return;
    const el = $("#pulsSpalten");
    if (!S.caps) {
      el.innerHTML = sekt("Puls", "", `<div class="z ruhig"><i></i><div class="z-t">Verbinde mit Todoist, Kalender und dem Speicher …</div></div>`, true);
      return;
    }
    if (ohneLive()) {
      el.innerHTML = sekt("Diese Ansicht", "", `<div class="z ruhig"><i></i>
        <div class="z-t">Hier siehst Du das Gerüst, nicht Deinen Tag.</div>
        <div class="z-m">Aufgaben, Termine und der Rechner-Stand hängen an Deiner Claude-Anmeldung. Öffne die Seite in claude.ai — dann füllen sich Puls und Kalender, und Eintragen, Verschieben und Wiederholen funktionieren.</div>
        <div class="z-a">${btn(`data-do="blick" data-blick="gehirn"`, "Aufbau ansehen", "mini")}</div></div>`, true);
      return;
    }
    el.innerHTML = klausurSektion() + planSektion() + jetztSektion() + kommtSektion() + rechnerSektion() + wiederholenSektion();
  }

  // ---------------------------------------------------------------- Statuszeile
  function renderStatus() {
    const s = (ton, text) => `<span class="${ton}"><i></i>${esc(text)}</span>`;
    const teile = [];
    if (!S.caps) teile.push(s("wait", "Verbinde …"));
    else {
      if (!S.mcp) teile.push(s("muted", "Todoist und Kalender nur in der Claude-Ansicht live"));
      else {
        teile.push(S.err.todoist && !S.projekt ? s("alarm", mcpText(S.err.todoist, "Todoist"))
          : s(S.projekt ? "ok" : "wait", S.projekt ? "Todoist live" : "Todoist lädt …"));
        teile.push(S.err.kalender && !S.events ? s("alarm", mcpText(S.err.kalender, "Google Kalender"))
          : s(S.events ? "ok" : "wait", S.events ? "Kalender live" : "Kalender lädt …"));
      }
      if (!S.db) teile.push(s("muted", "Speicher nicht verfügbar"));
      else if (S.err.db && !S.zustand) teile.push(s("alarm", dbText(S.err.db)));
      else if (S.zustand) {
        const a = rechnerAlterTage();
        teile.push(s(a > 2 ? "alarm" : "ok", a > 2 ? `Rechner-Stand ${a} Tage alt` : `Rechner-Stand ${stempel(S.zustand.stand)}`));
      } else teile.push(s("wait", "Rechner-Stand fehlt noch"));
      if (istStumm()) teile.push(s("muted", `Ruhe bis ${stempel(stummBis())}`));
    }
    $("#status").innerHTML = teile.join("");
  }

  // ---------------------------------------------------------------- Organ-Navigation
  function renderOrgane() {
    const el = $("#organeBody");
    if (!el) return;
    el.innerHTML = `<h2>Organe</h2>` + ORGANE.map((o) => {
      const n = organZahl(o), w = organWarn(o);
      return `<button type="button" class="organ${w ? " warn" : ""}" data-do="organ" data-id="${o.id}" style="--c:${o.farbe}">
        <i></i><span>${esc(o.name)}<em>${esc(o.rolle)}</em></span><small>${n == null ? "—" : esc(zahl(n))}</small></button>`;
    }).join("");
  }

  // ---------------------------------------------------------------- Detailblatt
  const blatt = $("#blatt"), blattBody = $("#blattBody");
  let blattWas = null;
  function blattZu() { blatt.hidden = true; blattWas = null; if (typeof auswahlSetzen === "function") auswahlSetzen(null); }
  function blattZeigen(html, was) {
    blattWas = was || null;
    blattBody.innerHTML = html;
    blatt.hidden = false;
    blattBody.scrollTop = 0;
  }

  function findeSache(art, id) {
    if (art === "aufgabe") return aufgaben().find((t) => t.id === id) || null;
    if (art === "termin") return termine().find((e) => e.id === id) || null;
    if (art === "thema") return themen().find((t) => t.id === id) || null;
    if (art === "klausur") return klausuren().find((k) => k.id === id) || null;
    if (art === "warnung") return warnungen().find((w) => w.id === id) || null;
    return null;
  }

  function blattSache(art, id) {
    const x = findeSache(art, id);
    if (!x) return;
    if (art === "aufgabe") {
      const wann = x.datum ? `${kurzDatum(x.datum)}${x.uhrzeit ? ", " + x.uhrzeit : ""} · ${rel(x.tage)}` : "ohne Datum";
      blattZeigen(`<h3>${esc(x.titel)}</h3>
        ${fakten([["Fällig", esc(wann)], ["Fach", esc(x.sektion?.name || "ohne Fach")],
          ["Labels", (x.labels || []).length ? x.labels.map((l) => pill(l === "abgabe" ? "alarm" : "info", l)).join(" ") : ""],
          ["Wiederholung", x.wiederkehrend ? esc(x.wiederkehrend) : ""],
          ["Unteraufgaben", x.unter ? esc(zahl(x.unter) + " offen") : ""],
          ["Priorität", x.prio !== "p4" ? pill("muted", x.prio) : ""]])}
        ${x.beschreibung ? `<p>${esc(x.beschreibung)}</p>` : ""}
        ${aktionen(x)}`, { art, id });
      return;
    }
    if (art === "termin") {
      blattZeigen(`<h3>${esc(x.titel)}</h3>
        ${fakten([["Wann", esc(`${x.tage === 0 ? "heute" : kurzDatum(x.datum)}${x.uhrzeit ? `, ${x.uhrzeit}${x.endUhr ? "–" + x.endUhr : ""}` : " · ganztägig"}`)],

        ${x.text ? `<p>${esc(kurz(x.text, 400))}</p>` : ""}

        <div class="z-a" style="margin:0">
          ${btn(`data-do="themaNeu"`, "Thema anlegen", "mini")}
          ${btn(`data-do="klausurWeg" data-id="${esc(x.id)}"`, "Klausur streichen", "mini still")}</div>`, { art, id });

        ["Stufe", esc(x.stufe || "")]])}${x.rat ? `<p>${esc(x.rat)}</p>` : ""}
        ${S.db ? `<div class="z-a">${btn(`data-do="passt" data-art="warnung" data-id="${esc(x.id)}"`, "Passt", "mini")}</div>` : ""}`, { art, id });

  function blattOrgan(id) {
    const o = organById[id];
    if (!o) return;
    const kopf = `<span class="organ-marke" style="--c:${o.farbe}"><i></i>${esc(o.rolle)}</span>
      <h3>${esc(o.name)}</h3>`;
    const p = (t) => (t ? `<p>${esc(t)}</p>` : "");
    let inhalt = p(o.text);
    const liste = (arr, f) => `<ul class="liste">${arr.map(f).join("")}</ul>`;

    if (id === "kalender") {
      if (!S.events) inhalt += p(S.err.kalender ? mcpText(S.err.kalender, "Google Kalender") : "Kalender lädt …");
      else { const T = termine(); inhalt += block("Nächste Termine", T.length ? T.slice(0, 12).map((e) => zeile(e, { ohneAktionen: true })).join("") : leer("Keine Termine.")); }
    } else if (id === "plan") {
      if (!S.projekt) inhalt += p(S.err.todoist ? mcpText(S.err.todoist, "Todoist") : "Todoist lädt …");
      else {
        const A = aufgaben(), Sek = sektionen();
        inhalt += fakten([["Offen", esc(zahl(A.length))], ["Fächer", esc(zahl(Sek.length))]]);
        const T = termine().filter((e) => e.vorlesung);
        inhalt += block("Fächer", liste(Sek, (s) => {
          const n = A.filter((t) => t.sectionId === s.id || t.sektion?.id === s.id).length;
          const vl = T.filter((e) => e.fach === s.name);
          const naechste = vl[0];
          return `<li class="z ${n ? "ruhig" : ""}"><i></i><div class="z-t">${esc(s.name)}</div><div class="z-r">${n} offen</div>
            <div class="z-m">${naechste ? `nächste Vorlesung ${esc(kurzDatum(naechste.datum))} ${esc(naechste.uhrzeit || "")}${vl.length > 1 ? ` · ${vl.length} in ${KOMMT_TAGE} Tagen` : ""}` : "keine Vorlesung in den nächsten " + KOMMT_TAGE + " Tagen"}${s.description ? " · " + esc(s.description) : ""}</div></li>`;
        }));
        const offen = [...new Set(T.filter((e) => !e.fach).map((e) => e.vorlesung.kurz))];
        if (offen.length) inhalt += `<p class="leer">Ohne Fach-Zuordnung: ${esc(offen.join(", "))}.</p>`;

    } else if (id === "todoist") {
      const A = aufgaben().filter((t) => t.tage != null && t.tage <= 0);
      inhalt += block("Heute wirklich", A.length ? A.map((t) => zeile(t)).join("") : leer(S.projekt ? "Heute ist nichts fällig." : "Todoist lädt …"));
    } else if (id === "gedaechtnis") {
      if (!S.db) inhalt += p("Der Speicher ist in dieser Ansicht nicht verfügbar.");
      else {
        const alle = themen(), K = klausuren();
        inhalt += fakten([["Themen", esc(zahl(alle.length))], ["Fällig", esc(zahl(themenFaellig().length))],
          ["Intervalle", INTERVALLE.join(" · ") + " Tage"]]);
        inhalt += `<div class="z-a" style="margin:0">
          ${btn(`data-do="themaNeu"`, "Thema anlegen", "mini primary")}
          ${btn(`data-do="klausurNeu"`, "Klausur eintragen", "mini")}</div>`;
        if (K.length) inhalt += block("Klausuren", K.map((k) => klausurZeile(k)).join(""));

      const L = laeufe();
      inhalt += fakten([["Läufe", esc(zahl(L.length))], ["Zeilen gesamt", esc(zahl(L.reduce((s, r) => s + (r.zeilen || 0), 0)))]]);

        <div class="z-m">${esc(zahl(r.zeilen))} Zeilen · ${esc(r.datei)}</div></li>`) : leer("Noch keine Läufe."));
    } else if (id === "haende") {
      const sk = S.zustand?.skripte || [];
      inhalt += block("Skripte", sk.length ? liste(sk, (s) => `<li class="z"><i></i>
        <div class="z-t">${esc(s.datei)}</div><div class="z-r">${esc(stempel(s.geaendert))}</div>

    } else if (id === "reflexe") {
      const w = warnungen();
      inhalt += block("Die sechs Regeln", liste(REFLEXE, ([t, x], i) => `<li class="z"><i></i>

        <div class="z-m">${esc(x)}</div></li>`));

        : leer(S.zustand ? "Beim letzten Rechner-Stand ist nichts aufgefallen." : "Kein Rechner-Stand."));
    } else if (id === "downloads") {
      const d = S.zustand?.downloads;
      if (d) inhalt += fakten([["Dateien", esc(zahl(d.dateien))], ["Größe", esc(zahl(d.mb)) + " MB"], ["Neu (7 Tage)", esc(zahl(d.neu7Tage))]]);
      const w = warnungen().filter((x) => x.organ === "downloads");
      if (w.length) inhalt += block("Meldungen", w.map(warnZeile).join(""));
    } else if (id === "ablage") {
      const r = S.zustand?.regeln;
      if (r) {
        inhalt += fakten([["Geprüft", esc(`${zahl(r.dateien)} Dateien · ${stempel(r.stand)}`)],
          ["Zugeordnet", esc(zahl(r.zugeordnet))], ["Prüfst Du", esc(zahl(r.liegenLassen))]]);
        inhalt += block("Regeln · erste passende gewinnt", liste((r.regeln || []).filter((x) => x.treffer > 0), (x) => `<li class="z"><i></i>
          <div class="z-t">${esc(x.name)}</div><div class="z-r">${esc(zahl(x.treffer))}</div>
          <div class="z-m">${esc(x.aktion)}${x.zielVorhanden === false ? " · Zielordner fehlt" : ""}</div></li>`));
        const fehl = r.beispielFehler || [];
        if (fehl.length) inhalt += block("Beispiele, die nicht passen", liste(fehl, (e) => `<li class="z alarm"><i></i>
          <div class="z-t">${esc(e.beispiel)}</div><div class="z-m">${esc(e.grund)}</div></li>`));
      }
    } else if (id === "takt") {
      const ph = S.zustand?.phasen || [];
      const p4 = ph.find((x) => x.nr === 4);
      inhalt += fakten([["Takt", "täglich 08:30"], ["Status", p4 ? (p4.status === "erledigt" ? pill("ok", "eingerichtet") : pill("open", "noch nicht eingerichtet · Phase 4")) : ""]]);
      if (ph.length) inhalt += block("Phasen", liste(ph, (x) => `<li class="z"><i></i>
        <div class="z-t">${x.nr} · ${esc(x.name)}</div><div class="z-r">${x.status === "erledigt" ? "erledigt" : "offen"}</div></li>`));
    } else if (id === "bericht") {
      const b = S.bericht;
      if (!b) inhalt += p("Noch kein Bericht. Er entsteht beim nächsten Morgenlauf.");
      else { inhalt += fakten([["Stand", esc(stempel(b.stand))]]);
        for (const a of b.abschnitte || []) inhalt += block(a.titel, (a.punkte || []).length
          ? liste(a.punkte, (x) => `<li class="z ${a.ton || ""}"><i></i><div class="z-t">${esc(x)}</div></li>`) : leer("Nichts.")); }
    } else if (id === "du") {
      inhalt += block("Zuletzt angelegt", S.journal.length ? liste(S.journal.slice(0, 8), (j) => `<li class="z"><i></i>
        <div class="z-t">${esc(j.titel)}</div><div class="z-r">${esc(stempel(j.am))}</div>
        <div class="z-m">${j.art === "termin" ? "Termin" : "Aufgabe"}${j.datum ? " · " + esc(kurzDatum(j.datum)) : ""}${j.uhrzeit ? " " + esc(j.uhrzeit) : ""}</div></li>`)
        : leer("Noch nichts über das Feld oben angelegt."));
    } else if (id === "agent-ordnung" || id === "agent-cortex") {
      if (!S.db) inhalt += p("Der Speicher ist in dieser Ansicht nicht verfügbar.");
      else {
        const key = id.replace("agent-", "");
        const meta = S.agenten[key];
        const rang = (v) => ({ neu: 0, angenommen: 1, umgesetzt: 2, abgelehnt: 3, "überholt": 3 }[v.status] ?? 4);
        const list = S.vorschlaege.filter((v) => v.agent === key).sort((a, b) => rang(a) - rang(b) || (a.nr || 0) - (b.nr || 0));
        const ST = { neu: ["info", "neu"], angenommen: ["ok", "wird umgesetzt"], umgesetzt: ["ok", "umgesetzt"],
          abgelehnt: ["muted", "verworfen"], "überholt": ["muted", "überholt"] };
        const RISIKO = { niedrig: "ok", mittel: "open", hoch: "alarm" };
        if (!meta && !list.length) inhalt += p("Noch kein Lauf. Sag im Chat „Starte die Agenten“.");
        else {
          inhalt += fakten([["Letzter Lauf", meta?.lauf ? esc(stempel(meta.lauf)) : ""], ["Geprüft", meta?.geprueft ? esc(meta.geprueft) : ""]]);
          if (meta?.zusammenfassung) inhalt += p(meta.zusammenfassung);
          const neu = list.filter((v) => v.status === "neu").length;
          inhalt += block(neu ? `Vorschläge · ${neu} neu` : "Vorschläge", list.map((v) => {
            const [sc, st] = ST[v.status] || ["muted", v.status];
            return `<div class="karte-v${v.status === "neu" ? "" : " erledigt"}">
              <h5>${esc(v.titel)}</h5>
              <p><b>Befund</b> ${esc(v.befund)}</p><p><b>Vorschlag</b> ${esc(v.vorschlag)}</p>
              <div class="meta">${pill(sc, st)}${v.bereich ? pill("muted", v.bereich) : ""}${pill("muted", "Aufwand " + (v.aufwand || "?"))}${pill(RISIKO[v.risiko] || "muted", "Risiko " + (v.risiko || "?"))}</div>
              ${v.status === "neu" ? `<div class="z-a" style="margin:0">
                ${btn(`data-do="vorschlag" data-id="${esc(v.id)}" data-status="angenommen"`, "Umsetzen lassen", "mini primary")}
                ${btn(`data-do="vorschlag" data-id="${esc(v.id)}" data-status="abgelehnt"`, "Verwerfen", "mini")}</div>` : ""}</div>`;
          }).join(""));
          if (list.some((v) => v.status === "angenommen"))
            inhalt += `<p class="leer">Angenommenes setzt Claude um, sobald Du im Chat sagst: „Setze die angenommenen Vorschläge um“.</p>`;
        }
      }
    } else if (id === "gmail" || id === "notion") {
      inhalt += p(id === "gmail" ? "Diese Quelle liest der Morgenlauf auf dem Rechner — sie hat hier keinen eigenen Live-Stand."
        : "Sobald klar ist, was in Notion liegt, kann dieses Organ etwas anzeigen.");
    }
    blattZeigen(kopf + inhalt, { art: "organ", id });
  }

      ${ziele.map((o) => btn(`data-do="spaeterZiel" data-art="${art}" data-id="${esc(id)}" data-datum="${o.datum}" data-uhrzeit="${o.uhrzeit || ""}"`,

  function blattPlanwahl() {
    const ids = planIds(), frei = PLAN_MAX - ids.length;
    const A = aufgaben().filter((t) => !ids.includes(t.id))
      .sort((a, b) => (a.tage ?? 999) - (b.tage ?? 999)).slice(0, 12);
    blattZeigen(`<h3>Drei für heute</h3>
      <p>${frei > 0 ? `Noch ${frei} ${frei === 1 ? "Platz" : "Plätze"} frei. Drei ist das Maximum — was nicht draufpasst, bleibt still in der Liste.`
        : "Alle drei Plätze sind belegt. Nimm erst einen heraus."}</p>
      ${frei > 0 && A.length ? `<div class="waehler">${A.map((t) => `<button type="button" data-do="planwaehle" data-id="${esc(t.id)}">
        <span>${esc(kurz(t.titel, 64))}</span><small>${esc(t.tage == null ? "ohne Datum" : rel(t.tage))}</small></button>`).join("")}</div>`
